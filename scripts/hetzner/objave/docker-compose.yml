# Samodejne objave (scripts/objave.mjs --zanka) na VM: /opt/slff-objave/
#   docker-compose.yml   ta datoteka
#   .env                 SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, DISCORD_OBJAVE_WEBHOOK,
#                        META_PAGE_TOKEN, META_PAGE_ID, META_IG_USER_ID (faza 2; brez njih ni objave)
#                        (chmod 600, ustvari lastnik, NI v gitu)
#   Dockerfile           slika Playwright + ffmpeg (reeli)
#   app/scripts/objave.mjs, app/scripts/objave-glasba/ (skladbe reelov),
#   app/node_modules/ (playwright, @supabase/supabase-js)
#   mediji/              prosojnice osnutkov (JPEG) in reeli (reel.mp4, naslovnica.jpg),
#                        <teden>-<slot>-<naključno>/…;
#                        javno prek Caddyja: https://slff.eu/objave-mediji/… (Meta jih prebere);
#                        ročni reeli (objava-reel.mjs) v mediji/rocni/<datum>-<naključno>/reel.mp4
#   rocni/               zasebno: zapisi ročnih reelov (objave.jsonl), zaklep; NI javno
# Objava: scripts/hetzner/objavi-objave.sh. CI tega ne objavi.
# Dnevnik: docker logs slff-objave. Preizkus brez pisanja:
#   docker compose run --rm objave node scripts/objave.mjs --slot pon --suho --mapa /mediji/suho
services:
  objave:
    # Chromium, Node in ffmpeg (reeli): Dockerfile ob tej datoteki, osnova = playwright iz package.json.
    build: .
    image: slff-objave:v1.64.0
    container_name: slff-objave
    restart: unless-stopped
    init: true
    # Gostiteljevo omrežje kot slff-posta: PostgREST prek envoy na 127.0.0.1:8000.
    network_mode: host
    user: pwuser
    working_dir: /app
    command: ["node", "scripts/objave.mjs", "--zanka"]
    environment:
      SUPABASE_URL: http://127.0.0.1:8000
      # Stran s prosojnicami (/objava); mora biti objavljena različica s to potjo.
      OBJAVE_URL: https://slff.eu
      OBJAVE_MAPA: /mediji
      ROCNI_MAPA: /rocni
      TZ: Europe/Ljubljana
    env_file: .env
    volumes:
      - ./app:/app:ro
      - ./mediji:/mediji
      - ./rocni:/rocni
    shm_size: 512m
    mem_limit: 1536m
    cpus: 1.0
