# SLFF: only what the app uses (no realtime, studio, pooler, imgproxy).
# Studio on demand: docker compose --profile off up -d studio meta (+ ssh tunnel to 8000).
services:
  studio:    { profiles: ["off"] }
  realtime:  { profiles: ["off"] }
  imgproxy:  { profiles: ["off"] }
  supavisor: { profiles: ["off"] }
  # Player photos (bucket fotografije-igralcev, docs/hetzner-shramba.md). Files on disk in
  # ./volumes/storage (backed up by varnostna.sh), rows in storage.*; the env comes from
  # the base file (JWT secret/JWKS, keys, DATABASE_URL as supabase_storage_admin).
  # No imgproxy: the browser already makes the 256 and 64 px WebP, no transforms needed.
  storage:
    image: supabase/storage-api:v1.74.0  # same as the base file of this stack (versions.md 2026-09-09)
    mem_limit: 384m  # ~110 MB idle; the 4 GB VM has ~1.2 GB free
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMGPROXY_URL: ""
      # Global ceiling; the bucket itself allows 2 MB (prevzem_pripravi_shrambo).
      FILE_SIZE_LIMIT: 5242880
  auth:
    image: supabase/gotrue:v2.197.0  # >= Supabase Cloud, or the auth dump does not fit
    extra_hosts:
      - host.docker.internal:host-gateway  # Caddy serves the email templates there
    # Production auth settings (`supabase config pull`, 2026-10-04).
    environment:
      GOTRUE_MAILER_OTP_LENGTH: 8
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_SMTP_MAX_FREQUENCY: 1m
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_OTP: 30
      GOTRUE_RATE_LIMIT_VERIFY: 30
      # Without it every visitor shares one rate-limit bucket (they all arrive from Envoy).
      GOTRUE_RATE_LIMIT_HEADER: ${RATE_LIMIT_HEADER:-}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://host.docker.internal:8089/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://host.docker.internal:8089/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://host.docker.internal:8089/magic_link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF — potvrď svoju e-mailovú adresu{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF — potvrdi svoju e-mail adresu{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: potvrď svou e-mailovou adresu{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: erősítsd meg az e-mail-címedet{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: bestätige deine E-Mail-Adresse{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: potvrdi svoju imejl adresu{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: confirmă-ți adresa de e-mail{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: kinnita oma e-posti aadress{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: potwierdź swój adres e-mail{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: confirma tu correo electrónico{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: apstiprini savu e-pasta adresi{{ else }}SLFF — potrdi svoj e-naslov{{ end }}'
      GOTRUE_MAILER_SUBJECTS_RECOVERY: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF — obnovenie hesla{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF — nova lozinka{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: obnovení hesla{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: új jelszó{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: neues Passwort{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: nova lozinka{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: parolă nouă{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: uus parool{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: nowe hasło{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: nueva contraseña{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: jauna parole{{ else }}SLFF — ponastavitev gesla{{ end }}'
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF — odkaz na prihlásenie{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF — poveznica za prijavu{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: odkaz pro přihlášení{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: belépési link{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: Link zur Anmeldung{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: link za prijavu{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: link de autentificare{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: sisselogimise link{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: link do logowania{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: enlace para iniciar sesión{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: pieteikšanās saite{{ else }}SLFF — povezava za prijavo{{ end }}'
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: 397012484212-mf60iqk3v6gfti2hvub5s0bhqhrg5p6e.apps.googleusercontent.com  # own client in slff-cb58e
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: "true"
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: eu.slff.app.signin,eu.slff.app
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
  rest:
    environment:
      PGRST_DB_MAX_ROWS: 5000  # production value, not the 1000 default
  api-gw:
    depends_on: !reset {}
    ports: !override
      - 127.0.0.1:8000:8000/tcp
  functions:
    environment:
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      # Mail via Mailcow on mail.slff.eu (same server as HelpStack mail), port 465.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # bmc-pivo: Buy Me a Coffee webhook -> Discord
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      BMC_WEBHOOK_SECRET: ${BMC_WEBHOOK_SECRET:-}
      # preverjen-placilo, stripe-webhook: Stripe (test mode first: sk_test_..., whsec_...)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # 1 = Checkout requires accepting the terms; set only after the ToS URL is in Stripe Public details
      STRIPE_TOS: ${STRIPE_TOS:-}
      SITE_URL: ${SITE_URL:-https://slff.eu}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  db:
    image: supabase/postgres:17.6.1.166
    # Docker da /dev/shm 64 MB; vzporedne poizvedbe ga presežejo ("could not
    # resize shared memory segment"). Pomnilnik se porabi le, ko ga poizvedba rabi.
    shm_size: 256m
    # ponytail: sized for the 4 GB VM; revisit after a rescale.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2560MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
    ports:
      - 127.0.0.1:5432:5432/tcp
