# SLFF: only what the app uses (no realtime, studio, pooler, imgproxy).
# Studio on demand: docker compose --profile off up -d studio meta (+ ssh tunnel to 8000).
services:
  studio:    { profiles: ["off"] }
  realtime:  { profiles: ["off"] }
  imgproxy:  { profiles: ["off"] }
  supavisor: { profiles: ["off"] }
  # Player photos (bucket fotografije-igralcev, docs/hetzner-shramba.md). Files on disk in
  # ./volumes/storage (backed up by varnostna.sh), rows in storage.*; the env comes from
  # the base file (JWT secret/JWKS, keys, DATABASE_URL as supabase_storage_admin).
  # No imgproxy: the browser already makes the 256 and 64 px WebP, no transforms needed.
  storage:
    image: supabase/storage-api:v1.74.0  # same as the base file of this stack (versions.md 2026-09-09)
    mem_limit: 384m  # ~110 MB idle; the 4 GB VM has ~1.2 GB free
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMGPROXY_URL: ""
      # Global ceiling; the bucket itself allows 2 MB (prevzem_pripravi_shrambo).
      FILE_SIZE_LIMIT: 5242880
  auth:
    image: supabase/gotrue:v2.197.0  # >= Supabase Cloud, or the auth dump does not fit
    extra_hosts:
      - host.docker.internal:host-gateway  # Caddy serves the email templates there
    # Production auth settings (`supabase config pull`, 2026-10-04).
    environment:
      GOTRUE_MAILER_OTP_LENGTH: 8
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_SMTP_MAX_FREQUENCY: 1m
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_OTP: 30
      GOTRUE_RATE_LIMIT_VERIFY: 30
      # Without it every visitor shares one rate-limit bucket (they all arrive from Envoy).
      GOTRUE_RATE_LIMIT_HEADER: ${RATE_LIMIT_HEADER:-}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://host.docker.internal:8089/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://host.docker.internal:8089/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://host.docker.internal:8089/magic_link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF: potvrď svoju e-mailovú adresu{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF: potvrdi svoju e-mail adresu{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: potvrď svou e-mailovou adresu{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: erősítsd meg az e-mail-címedet{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: bestätige deine E-Mail-Adresse{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: potvrdi svoju imejl adresu{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: kinnita oma e-posti aadress{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: potwierdź swój adres e-mail{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: confirma tu correo electrónico{{ else if eq (printf "%v" .Data.jezik) "en" }}SLFF: confirm your email address{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: confirmă adresa de e-mail{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: apstiprini savu e-pasta adresi{{ else if eq (printf "%v" .Data.jezik) "mk" }}SLFF: потврди ја својата е-адреса{{ else if eq (printf "%v" .Data.jezik) "el" }}SLFF: επιβεβαίωσε το email σου{{ else if eq (printf "%v" .Data.jezik) "tr" }}SLFF: e-posta adresini onayla{{ else if eq (printf "%v" .Data.jezik) "uk" }}SLFF: підтверди свою електронну адресу{{ else if eq (printf "%v" .Data.jezik) "hy" }}SLFF: հաստատիր էլ. հասցեդ{{ else if eq (printf "%v" .Data.jezik) "az" }}SLFF: e-poçt ünvanını təsdiqlə{{ else if eq (printf "%v" .Data.jezik) "da" }}SLFF: bekræft din e-mailadresse{{ else }}SLFF: potrdi svoj e-naslov{{ end }}'
      GOTRUE_MAILER_SUBJECTS_RECOVERY: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF: nastav si nové heslo{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF: postavi novu lozinku{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: nastav si nové heslo{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: új jelszó beállítása{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: neues Passwort festlegen{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: postavi novu lozinku{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: määra uus parool{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: ustaw nowe hasło{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: crea una contraseña nueva{{ else if eq (printf "%v" .Data.jezik) "en" }}SLFF: set a new password{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: setează o parolă nouă{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: iestati jaunu paroli{{ else if eq (printf "%v" .Data.jezik) "mk" }}SLFF: постави нова лозинка{{ else if eq (printf "%v" .Data.jezik) "el" }}SLFF: όρισε νέο κωδικό{{ else if eq (printf "%v" .Data.jezik) "tr" }}SLFF: yeni şifre belirle{{ else if eq (printf "%v" .Data.jezik) "uk" }}SLFF: створи новий пароль{{ else if eq (printf "%v" .Data.jezik) "hy" }}SLFF: սահմանիր նոր գաղտնաբառ{{ else if eq (printf "%v" .Data.jezik) "az" }}SLFF: yeni şifrə təyin et{{ else if eq (printf "%v" .Data.jezik) "da" }}SLFF: vælg en ny adgangskode{{ else }}SLFF: nastavi novo geslo{{ end }}'
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: '{{ if eq (printf "%v" .Data.jezik) "sk" }}SLFF: tvoj odkaz na prihlásenie{{ else if eq (printf "%v" .Data.jezik) "hr" }}SLFF: tvoja poveznica za prijavu{{ else if eq (printf "%v" .Data.jezik) "cs" }}SLFF: tvůj odkaz pro přihlášení{{ else if eq (printf "%v" .Data.jezik) "hu" }}SLFF: belépési linked{{ else if eq (printf "%v" .Data.jezik) "de" }}SLFF: dein Anmeldelink{{ else if eq (printf "%v" .Data.jezik) "sr" }}SLFF: tvoj link za prijavu{{ else if eq (printf "%v" .Data.jezik) "et" }}SLFF: sinu sisselogimislink{{ else if eq (printf "%v" .Data.jezik) "pl" }}SLFF: twój link do logowania{{ else if eq (printf "%v" .Data.jezik) "es" }}SLFF: tu enlace para iniciar sesión{{ else if eq (printf "%v" .Data.jezik) "en" }}SLFF: your sign-in link{{ else if eq (printf "%v" .Data.jezik) "ro" }}SLFF: linkul tău de conectare{{ else if eq (printf "%v" .Data.jezik) "lv" }}SLFF: tava pieteikšanās saite{{ else if eq (printf "%v" .Data.jezik) "mk" }}SLFF: твојата врска за најава{{ else if eq (printf "%v" .Data.jezik) "el" }}SLFF: ο σύνδεσμος σύνδεσής σου{{ else if eq (printf "%v" .Data.jezik) "tr" }}SLFF: giriş bağlantın{{ else if eq (printf "%v" .Data.jezik) "uk" }}SLFF: твоє посилання для входу{{ else if eq (printf "%v" .Data.jezik) "hy" }}SLFF: մուտքի հղումդ{{ else if eq (printf "%v" .Data.jezik) "az" }}SLFF: giriş keçidin{{ else if eq (printf "%v" .Data.jezik) "da" }}SLFF: dit login-link{{ else }}SLFF: tvoja povezava za prijavo{{ end }}'
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: 397012484212-mf60iqk3v6gfti2hvub5s0bhqhrg5p6e.apps.googleusercontent.com  # own client in slff-cb58e
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: "true"
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: eu.slff.app.signin,eu.slff.app
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
  rest:
    environment:
      PGRST_DB_MAX_ROWS: 5000  # production value, not the 1000 default
  api-gw:
    depends_on: !reset {}
    ports: !override
      - 127.0.0.1:8000:8000/tcp
  functions:
    environment:
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      # Mail via Mailcow on mail.slff.eu (same server as HelpStack mail), port 465.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Anketa plačila (SLF-211) gre od info@slff.eu: geslo nabiralnika info@ (isto kot INFO_IMAP_PASS)
      INFO_SMTP_PASS: ${INFO_SMTP_PASS:-}
      # bmc-pivo: Buy Me a Coffee webhook -> Discord
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      BMC_WEBHOOK_SECRET: ${BMC_WEBHOOK_SECRET:-}
      # preverjen-placilo, stripe-webhook: Stripe (test mode first: sk_test_..., whsec_...)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # 1 = Checkout requires accepting the terms; set only after the ToS URL is in Stripe Public details
      STRIPE_TOS: ${STRIPE_TOS:-}
      SITE_URL: ${SITE_URL:-https://slff.eu}
      # trgovina-nakup (shop.slff.eu): pepper for the hashed-IP open-order limit (required),
      # optional shipping-rate ids {kljuc: shr_...} instead of a Stripe lookup.
      TRGOVINA_PEPPER: ${TRGOVINA_PEPPER:-}
      SHOP_URL: ${SHOP_URL:-https://shop.slff.eu}
      TRGOVINA_TARIFE: ${TRGOVINA_TARIFE:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # posnetki-igralca: ponudnik novih posnetkov r2 | stream | test (privzeto r2, če so R2_*)
      POSNETKI_PONUDNIK: ${POSNETKI_PONUDNIK:-}
      # Cloudflare R2 (zasebno vedro, podpisani PUT/GET; docs/podatkovni-model.md, Izložba)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-slff-posnetki}
      # Cloudflare Stream (izložba preverjenih igralcev; docs/podatkovni-model.md, Izložba)
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_STREAM_TOKEN: ${CF_STREAM_TOKEN:-}
      CF_STREAM_DOMAIN: ${CF_STREAM_DOMAIN:-}
      CF_STREAM_WEBHOOK_SECRET: ${CF_STREAM_WEBHOOK_SECRET:-}
      CF_STREAM_KEY_ID: ${CF_STREAM_KEY_ID:-}
      CF_STREAM_KEY_JWK: ${CF_STREAM_KEY_JWK:-}
      POSNETKI_ORIGINS: ${POSNETKI_ORIGINS:-}
  db:
    image: supabase/postgres:17.6.1.166
    # Docker da /dev/shm 64 MB; vzporedne poizvedbe ga presežejo ("could not
    # resize shared memory segment"). Pomnilnik se porabi le, ko ga poizvedba rabi.
    shm_size: 256m
    # ponytail: sized for the 4 GB VM; revisit after a rescale.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2560MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
    ports:
      - 127.0.0.1:5432:5432/tcp
