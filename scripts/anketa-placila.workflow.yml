name: Anketa placila (enkratna, SLF-211)
# Agentni zeton nima pravice `workflow`: kdor zdruzi, premakne to datoteko v
# .github/workflows/anketa-placila.yml (git mv), sicer delovnega toka ni.

# En oseben mail "kaj bi placal" najvec 20 aktivnim uporabnikom iz razlicnih
# drzav (`posli-opomnik`, vrsta `anketa-placila`; kdo, doloci
# `kandidati_za_anketo`). Enkrat na cloveka za vedno, brez odjavljenih
# (`brez_opomnikov`), adminov, hisnih ekip, mladinskih in @slff.eu racunov.
#
# Naslovi ne zapustijo edge funkcije; ta dnevnik je javen in pokaze le drzavo,
# jezik, aktivne dni in dejanja ter odtis kohorte.
#
# Postopek (brez urnika):
#   1. zagon s `suho: true` -> predogled in odtis kohorte,
#   2. Lovro/Nejc/Luka potrdi predogled,
#   3. zagon s `suho: false` in `kohorta: <odtis>` -> najvec 10 mailov,
#   4. drugi paket: spet 1-3 (nov odtis za preostale).
on:
  workflow_dispatch:
    inputs:
      suho:
        description: 'Suhi tek (samo predogled, ne poslje)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      kohorta:
        description: 'Odtis kohorte iz potrjenega suhega teka (za posiljanje)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: opozorila
  cancel-in-progress: false

jobs:
  anketa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anketa placila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUHO: ${{ inputs.suho }}
          KOHORTA: ${{ inputs.kohorta }}
        run: node scripts/anketa-placila.mjs
