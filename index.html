<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo/slff-grb.png" />
    <link rel="apple-touch-icon" href="/logo/slff-grb.png" />
    <meta name="theme-color" content="#2f6b4f" />
    <title>SLFF — Sunday League Fantasy Football</title>
    <!-- Kanonični naslov ustvari App.tsx (useKanonicni) ob vsaki navigaciji za trenutno pot;
         statičen "/" bi iskalnikom brez JS vse podstrani označil za naslovnico. -->
    <meta name="description" content="Fantasy football za slovenske medobčinske nogometne lige. Sestavi ekipo, izberi kapetana in tekmuj s sosedi." />

    <!-- Kartica ob delitvi (Facebook, WhatsApp, Viber).
         Brez teh oznak se povezava objavi kot gola vrstica brez slike in
         naslova — klub, ki jo deli na svoji strani, bi objavil nekaj, kar
         izgleda kot pomota. Gre za eno sliko za vso stran: SPA vsem potem
         vrne isti index.html, zato kartice za posamezen klub s tem ni. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SLFF" />
    <meta property="og:title" content="SLFF — Sunday League Fantasy Football" />
    <meta property="og:description" content="Fantasy liga za slovenske medobčinske lige. Sestavi ekipo iz pravih igralcev, točke prihajajo iz uradnih zapisnikov: goli, minute, ohranjene mreže." />
    <meta property="og:image" content="https://slff.eu/og/slff-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://slff.eu/" />
    <meta property="og:locale" content="sl_SI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SLFF — Sunday League Fantasy Football" />
    <meta name="twitter:description" content="Fantasy liga za slovenske medobčinske lige. Točke iz uradnih zapisnikov." />
    <meta name="twitter:image" content="https://slff.eu/og/slff-og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
