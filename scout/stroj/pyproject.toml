[project]
name = "slff-stroj"
version = "1.0.0"
description = "SLFF Scout: nocni analiticni stroj"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.1.3",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stroj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
