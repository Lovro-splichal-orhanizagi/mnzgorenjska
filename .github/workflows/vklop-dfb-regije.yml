name: Preverjen vklop DFB regije
run-name: Preverjen vklop DFB regije ${{ inputs.liga }}
on:
  workflow_dispatch:
    inputs:
      liga:
        description: Neaktivna regionalna liga
        type: choice
        required: true
        options: [de-regionalliga-nord, de-regionalliga-west, de-regionalliga-suedwest, de-regionalliga-bayern]
      source_commit:
        description: Pregledani celotni SHA obeh zajemov ali ponovitev
        type: string
        required: true
      archive_run:
        description: Uspešen arhivski audit ali preverjena ponovitev
        type: string
        required: true
      current_run:
        description: Uspešen tekoči audit ali ponovitev (izvirni zajem največ 12 ur)
        type: string
        required: true
      approved_sha256:
        description: Pregledani SHA manifesta; prazno pripravi dokaz brez baze
        type: string
        required: false
      activate:
        description: Atomsko vklopi po preverbi
        type: boolean
        default: false
      server_ready:
        description: Preverjena namestitev DE HTML/Caddy in nemških opomnikov
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
concurrency:
  group: uvoz-lige-${{ inputs.liga }}
  cancel-in-progress: false
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIGA: ${{ inputs.liga }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIVE_RUN: ${{ inputs.archive_run }}
      CURRENT_RUN: ${{ inputs.current_run }}
      APPROVED_SHA: ${{ inputs.approved_sha256 }}
      SERVER_READY: ${{ inputs.server_ready }}
      ACTIVATE: ${{ inputs.activate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preveri dejanska sezonska posla in pregledani razčlenjevalnik
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "$ACTIVATE" = true ] && { [ -z "$APPROVED_SHA" ] || [ "$SERVER_READY" != true ]; }; then exit 1; fi
          node scripts/preveri-zagona-dfb-regije.mjs "$LIGA" "$SOURCE_COMMIT" "$ARCHIVE_RUN" "$CURRENT_RUN" release/jobs.json audit/archive audit/current
      - name: Ponovi vse izvorne bajte brez omrežja
        run: |
          set -euo pipefail
          node scripts/vklopi-dfb-regijo.mjs prepare "$LIGA" audit/archive audit/current "$SOURCE_COMMIT" release/jobs.json release/manifest.json | tee release/summary.json
      - name: Počakaj na starejše uvoze
        if: inputs.approved_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cakaj-na-uvoze.mjs --liga "$LIGA"
      - name: Atomska preverba in izrecni vklop
        if: inputs.approved_sha256 != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mode=check
          if [ "$ACTIVATE" = true ]; then mode=activate; fi
          node scripts/vklopi-dfb-regijo.mjs "$mode" release/manifest.json "$APPROVED_SHA" | tee release/database.json
      - name: Pregledni manifest in rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfb-regional-release-${{ github.run_id }}
          path: release/
          if-no-files-found: ignore
          retention-days: 90
