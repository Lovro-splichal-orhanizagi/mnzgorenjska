name: Tedensko prevrednotenje

# Cena je izracunana ob postavitvi lige, med sezono pa jo premika borza:
# najvec ±0.3 na krog in nikoli vec kot 3.0 od `value_start`. Kdor je ob
# postavitvi imel premalo minut, je dobil privzeto 4.5 — in ce je pozneje
# postal nosilec igre, ostane poceni vso sezono.
#
# Ta zagon zato enkrat tedensko izracuna ceno na novo in jo PRIBLIZA
# izracunani, najvec za 1.0. Brez te omejitve bi igralec cez noc poskocil s
# 4.5 na 9.0, uporabnik pa ga ima v ekipi po stari ceni in proracun je vezan
# na ceno ob nakupu. Sidro borze potuje z isto razliko, sicer bi cena takoj
# obstala ob meji.
#
# V torek, ker so takrat vikend zapisniki ze uvozeni, v bazi pa je v
# ponedeljek ob 2:00 ze steklo tedensko potrjevanje pozicij (`uveljavi_pozicije`)
# — pozicija odloca, koliko je vreden gol, zato mora biti prej znana.
# Igralce z zgodovino cen prepustimo borzi, da ponovna uveljavitev starega
# kroga ne povozi tedenske cene ob premaknjenem sidru.
# Urnik je bil izklopljen, ker ponovni zagon v istem tednu premakne ceno se
# enkrat: vsak zagon jo priblizna za najvec 1.0, dvakrat torej za 2.0, in z
# njo potuje sidro borze. Zdaj si igralec zapomni, v katerem ISO tednu je bil
# prevrednoten (`players.repriced_week`), in ga isti teden ne premaknemo
# drugic. Ponovni zagon je zato varen — pobere le tiste, ki jih prvi ni.
#
# Za izjemo obstaja `--znova`, ki varovalo povozi.
on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:
    inputs:
      najvec:
        description: 'Najvecji premik cene v enem zagonu'
        required: false
        default: '1.0'
        type: string

permissions:
  contents: read

# Lastna skupina (prej skupna `uvoz`, kjer je nocni cron izpodrival cakajoci
# zagon). Cene istih igralcev pise tudi uvoz-lige (korak cene), zato prvi
# korak pocaka na starejse zagone iz druzine uvozov — glej uvoz-zapisnikov.yml.
concurrency:
  group: tedensko-cene
  cancel-in-progress: false

jobs:
  cene:
    runs-on: ubuntu-latest
    # 30 minut dela + do 120 minut cakanja na starejsi uvoz.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      NAJVEC: ${{ inputs.najvec || '1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      # Druzina uvozov (uvoz-zapisnikov, uvoz-lige, zdruzi-klube,
      # tedensko-cene) pise v iste tabele: klube, igralce, tekme, cene. Zato
      # tecejo po vrsti — po casu zacetka, brez izpodrivanja.
      - name: Pocakaj na starejse uvoze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MOJ=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt --jq .startedAt)
          for i in $(seq 1 120); do
            n=0
            for wf in uvoz-zapisnikov.yml uvoz-lige.yml zdruzi-klube.yml tedensko-cene.yml; do
              # Brez --status: tudi cakajoci (queued) starejsi zagon mora priti
              # prvi. Zato vec kot 20 — koncani zagoni zasedejo del seznama.
              k=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 50 \
                --json databaseId,startedAt,status \
                --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID and .startedAt > \"2000\" and (.startedAt < \"$MOJ\" or (.startedAt == \"$MOJ\" and .databaseId < $GITHUB_RUN_ID)))] | length")
              n=$((n + k))
            done
            [ "$n" -eq 0 ] && exit 0
            echo "Pred mano tece se $n uvozov — cakam ($i/120 min)"
            sleep 60
          done
          echo "::error::Starejsi uvoz tece ze dve uri."
          exit 1

      - name: Prevrednoti vklopljene lige
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/aktivna-tekmovanja.mjs > /tmp/lige.txt
          echo "Lige: $(tr '\n' ' ' < /tmp/lige.txt)"
          # Ena liga ne sme podreti ostalih — isto kot pri uvozu. Tu je se bolj
          # pomembno: liga, ki jo prekine napaka na pol poti, ima del igralcev
          # prevrednoten in del ne. Zig `repriced_week` poskrbi, da naslednji
          # zagon pobere samo preostale in nikogar ne premakne dvakrat.
          padle=""
          while IFS= read -r liga; do
            [ -n "$liga" ] || continue
            echo "::group::$liga"
            if node scripts/ovrednoti-igralce.mjs --tekmovanje "$liga" --tedensko --pisi --najvec "$NAJVEC"; then
              echo "$liga: v redu"
            else
              echo "::warning title=Prevrednotenje::$liga ni uspela; ostale se nadaljujejo"
              padle="$padle $liga"
            fi
            echo "::endgroup::"
          done < /tmp/lige.txt
          if [ -n "$padle" ]; then
            echo "::error title=Neuspele lige::$padle"
            exit 1
          fi

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Tedensko prevrednotenje"
