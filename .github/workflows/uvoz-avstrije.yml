name: Uvoz Avstrije (vrsta)

# Avstrijske lige iz scripts/avstrija-vrsta.txt eno za drugo: uvoz (z arhivom
# in cenami), ob uspehu vklop (`vklopi_ligo_sredi_sezone`), hišne ekipe in
# grbi. Vsak tik je kratek in brez spomina — stanje razbere iz zgodovine
# zagonov `uvoz-lige.yml` in baze (scripts/vrsta-avstrije.mjs). Nov uvoz
# zažene le, ko noben uvoz at- lige ne teče, in največ enega na tik.
#
# Premor ali konec: delovni tok izklopi (Actions → Disable workflow).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      po_uvozu:
        description: 'Sprožil ga je konec uvoza (počakaj, da se zagon zaključi)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uvoz-avstrije
  cancel-in-progress: false

jobs:
  tik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Sprožen s konca uvoza: tisti zagon se zaključi šele nekaj sekund pozneje
      # in bi ga tik sicer videl kot "še teče".
      - name: Pocakaj na konec uvoza
        if: inputs.po_uvozu
        run: sleep 60
      - name: Naslednji korak vrste
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/vrsta-avstrije.mjs
      - name: Javi napako
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/javi-napako.mjs "Uvoz Avstrije (vrsta)"
