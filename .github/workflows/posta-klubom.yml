name: Pošta klubom

# Vrsta mailov klubom iz luka@slff.eu (scripts/posta-klubom.mjs): vsakih 10
# minut največ dva maila; okno države (08–18, pon–sob) in dnevno mejo 100
# preveri skripta. Ročno: `suho` pokaže naslednje maile, `napolni` napolni
# vrsto (scripts/vrsta-poste-klubom.mjs, najprej brez `pisi`).
on:
  schedule:
    - cron: '*/10 5-17 * * 1-6'
  workflow_dispatch:
    inputs:
      nacin:
        description: 'posli | suho | napolni'
        type: choice
        options: [suho, posli, napolni]
        default: suho
      drzava:
        description: 'Država za napolni'
        type: choice
        options: [AT, EE]
        default: AT
      pisi:
        description: 'napolni: zapiši v bazo'
        type: boolean
        default: false
      poslji_od:
        description: 'napolni: prvi mail ne pred (ISO, npr. 2027-03-01T08:00:00Z)'
        type: string
        default: ''

# Pošiljanje se ne prekriva samo s sabo; polnjenje (lahko ure) ga ne zadrži.
concurrency:
  group: posta-klubom-${{ inputs.nacin == 'napolni' && 'napolni' || 'posli' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  posta:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pošta klubom
        env:
          NACIN: ${{ inputs.nacin || 'posli' }}
          DRZAVA: ${{ inputs.drzava }}
          PISI: ${{ inputs.pisi }}
          POSLJI_OD: ${{ inputs.poslji_od }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LUKA_SMTP_GESLO: ${{ secrets.LUKA_SMTP_GESLO }}
        run: |
          case "$NACIN" in
            napolni)
              a=(--drzava "$DRZAVA")
              [ "$PISI" = true ] && a+=(--pisi)
              [ -n "$POSLJI_OD" ] && a+=(--poslji-od "$POSLJI_OD")
              node scripts/vrsta-poste-klubom.mjs "${a[@]}" ;;
            suho)
              node scripts/posta-klubom.mjs --suho ;;
            *)
              if [ -z "$LUKA_SMTP_GESLO" ]; then
                echo "::notice::Skrivnost LUKA_SMTP_GESLO ni nastavljena — pošta klubom čaka."
                exit 0
              fi
              node scripts/posta-klubom.mjs ;;
          esac
