name: Grbi z NZS

# Grbi klubov iz NZS za lige, ki jih NZS objavlja (SNL in mladinske SML).
# Skripta potrebuje zivi kljuc baze IN zapise datoteke v public/grbi, ki jih
# streze Vercel — zato tece tu in spremembe sama zapise v git. Ujema samo
# enaka imena; kar ostane, izpise za rocni pregled v dnevniku.
on:
  workflow_dispatch:

concurrency:
  group: uvoz
  cancel-in-progress: false

jobs:
  grbi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prenesi grbe in zapisi logo_url
        run: node scripts/prenesi-grbe-nzs.mjs --pisi
      - name: Zapisi nove grbe v git
        run: |
          set -euo pipefail
          git add public/grbi
          if git diff --cached --quiet; then echo "Ni novih grbov."; exit 0; fi
          git config user.name "slff-bot"
          git config user.email "slff-bot@users.noreply.github.com"
          git commit -m "Grbi z NZS ($(git diff --cached --numstat | wc -l | tr -d ' ') datotek)"
          # Medtem je lahko nekdo potisnil na main: potegni in poskusi znova.
          # Baza ze kaze na te datoteke, zato push ne sme tiho pasti.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            [ "$i" -lt 5 ] || { echo "push ni uspel po 5 poskusih"; exit 1; }
            sleep $((i * 10))
          done
          # Push z GITHUB_TOKEN ne sprozi CI in z njim objave na Vercel;
          # brez tega bi baza kazala na grbe, ki jih stran se ne streze.
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
