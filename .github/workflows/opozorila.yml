name: Opozorila pred rokom

# Ekipa se iz kroga v krog prenasa sama: `zakleni_krog` ob roku posname
# shranjeni kader in uporabniku ni treba storiti nicesar. Izjema je kader, ki
# ob roku ni vec veljaven — takrat posnetka ni, krog je brez tock in doslej
# tega ni povedal nihce.
#
# Kader lahko postane neveljaven tudi brez lastnikove spremembe:
# `roster_je_veljaven` gleda TRENUTNI klub igralca, zato pravi prestop v ligi
# ekipo s tremi igralci enega kluba cez noc spremeni v ekipo s stirimi. Tako
# je 8 ekip izgubilo 4. krog pri clanih.
#
# Zato ta zagon pogleda, katerim ligam rok pade v naslednjih 24 urah, in
# lastnikom neveljavnih ekip poslje eno posto — z razlogom, ne le z "nekaj je
# narobe". Enkrat na krog (`email_log.round_id`), a za vsak krog znova,
# dokler ekipe ne popravi.
#
# Urnik je vklopljen, ker posta ni mnozicna: gre samo tistim, ki ekipo IMAJO
# in se jim ne bo zaklenila. Opomnik vsem brez ekipe je druga stvar in ostaja
# rocen (`opomniki.yml`).
on:
  schedule:
    # Vsako uro PREVERI, posta pa gre enkrat na krog: ob prvem teku, ko je do
    # roka manj kot 24 ur. Pogosto zato, ker GitHub urnik zamika za ure (jutranji
    # tek ob 8:00 je stekel ob 12:18, po roku ob 10:00), in ker ekipa, ki nastane
    # ali se pokvari zvecer pred rokom, sicer ne bi dobila nicesar.
    # Minuta 17, ker je ob polni uri GitHub najbolj zaseden.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      suho:
        description: 'Suhi tek (samo presteje, ne poslje)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: opozorila
  cancel-in-progress: false

jobs:
  opozori:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      - name: Poslji opozorila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VRSTA: opozorilo
          # En dan: opozorilo pride 24 ur pred rokom (oz. ob prvem teku po tem).
          DNI: 1
          SUHO: ${{ github.event_name == 'workflow_dispatch' && inputs.suho || 'false' }}
        run: node scripts/posli-opomnike.mjs

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Opozorila pred rokom"
