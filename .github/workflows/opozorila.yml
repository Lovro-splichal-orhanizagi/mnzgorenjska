name: Opozorila pred rokom

# Ekipa se iz kroga v krog prenasa sama: `zakleni_krog` ob roku posname
# shranjeni kader in uporabniku ni treba storiti nicesar. Izjema je kader, ki
# ob roku ni vec veljaven — takrat posnetka ni, krog je brez tock in doslej
# tega ni povedal nihce.
#
# Kader lahko postane neveljaven tudi brez lastnikove spremembe:
# `roster_je_veljaven` gleda TRENUTNI klub igralca, zato pravi prestop v ligi
# ekipo s tremi igralci enega kluba cez noc spremeni v ekipo s stirimi. Tako
# je 8 ekip izgubilo 4. krog pri clanih.
#
# Zato ta zagon vsak dan pogleda, katerim ligam rok pade v naslednjih dveh
# dneh, in lastnikom takih ekip poslje eno posto — z razlogom, ne le z
# "nekaj je narobe". Enkrat na krog, za kar skrbi `email_log.round_id`.
#
# Urnik je vklopljen, ker posta ni mnozicna: gre samo tistim, ki ekipo IMAJO
# in se jim ne bo zaklenila. Opomnik vsem brez ekipe je druga stvar in ostaja
# rocen (`opomniki.yml`).
on:
  schedule:
    # Dvakrat na dan, ker urnik GitHuba ni zanesljiv: uvozov cron `0 5 * * 1-4`
    # se v praksi sprozi okoli 9:40 UTC, torej stiri ure in pol pozneje, nov
    # urnik pa prvi dan sploh ni stekel. Opozorilo pride enkrat na tezavo, zato
    # drugi termin ne pomeni vec poste — pomeni le, da izpusceni prvi ne pobere
    # obljube "dva dni prej" s seboj.
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      suho:
        description: 'Suhi tek (samo presteje, ne poslje)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: opozorila
  cancel-in-progress: false

jobs:
  opozori:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Poslji opozorila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VRSTA: opozorilo
          # Okno je 3 dni, ne 2, ker zagon tece enkrat na dan ob 8:00.
          # Pri dvodnevnem oknu bi liga z rokom ob 8:30 padla cez rob — zagon
          # dva dni prej je ne bi zajel (8:30 > 8:00), naslednji pa sele dan
          # pred rokom. Trije dnevi zagotovijo, da posta pride VSAJ dva dni
          # prej. Ker opozorilo pride enkrat na tezavo, sirse okno ne pomeni
          # vec poste — pomeni le zgodnejso.
          DNI: 3
          SUHO: ${{ github.event_name == 'workflow_dispatch' && inputs.suho || 'false' }}
        run: node scripts/posli-opomnike.mjs

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Opozorila pred rokom"
