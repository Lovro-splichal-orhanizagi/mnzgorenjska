name: Preverba podatkov

# Vsaka huda napaka v tem projektu je bila TIHA: uvoz je porocal uspeh in
# vpisal smeti, testi so bili zeleni, stran je izrisala stevilko. Enotski
# testi tega ne ujamejo, ker koda naredi natanko to, kar ji pise.
#
# Ujame jih sele trditev o podatkih samih — in ta mora teci sama od sebe,
# sicer je nihce ne pozene. Zato vsak dan po nocnem uvozu, ob tezavi pa
# sporocilo na Discord.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  # Po uvozu zapisnikov: ce je uvoz kaj pokvaril, naj se izve takoj.
  workflow_run:
    workflows: ['Uvoz zapisnikov', 'Uvoz lige (rocno)']
    types: [completed]

permissions:
  contents: read

jobs:
  preveri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      - name: Trditve o podatkih
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/preveri-podatke.mjs --discord

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Preverba podatkov"
