name: Preverba podatkov

# Vsaka huda napaka v tem projektu je bila TIHA: uvoz je porocal uspeh in
# vpisal smeti, testi so bili zeleni, stran je izrisala stevilko. Enotski
# testi tega ne ujamejo, ker koda naredi natanko to, kar ji pise.
#
# Ujame jih sele trditev o podatkih samih — in ta mora teci sama od sebe,
# sicer je nihce ne pozene. Zato vsak dan po nocnem uvozu, ob tezavi pa
# sporocilo na Discord.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  # Po uvozu zapisnikov: ce je uvoz kaj pokvaril, naj se izve takoj.
  workflow_run:
    workflows: [Croatia captured imports, 'Uvoz zapisnikov', 'Uvoz lige (rocno)', 'Replay retained FUSSBALL cards']
    types: [completed]

permissions:
  contents: read
  # Ali uvoz ravno piše (gh run list).
  actions: read

jobs:
  preveri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      # Med uvozom so tekme napol zapisane in preverba javi lažne težave.
      # Konec uvoza jo sproži znova (workflow_run), zato tu le preskočimo.
      - name: Ali uvoz ravno piše
        id: uvoz
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node scripts/cakaj-na-uvoze.mjs --tece
          k=$?
          [ "$k" -eq 3 ] && echo "tece=1" >> "$GITHUB_OUTPUT" && exit 0
          exit $k
      - name: Trditve o podatkih
        if: steps.uvoz.outputs.tece != '1'
        id: trditve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ok=1
          node scripts/preveri-podatke.mjs --izhod tezave.txt || ok=0
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ -s tezave.txt ]; then
            echo "odtis=$(sha256sum tezave.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      # Isti seznam težav gre na Discord enkrat; po vsakem uvozu znova bi
      # ob štirih ročnih uvozih prišla štiri enaka sporočila. Jutranja preverba
      # javi vedno, da odprta težava ne utone.
      - name: Ali je ta seznam že javljen
        if: steps.trditve.outputs.odtis
        id: javljeno
        uses: actions/cache/restore@v4
        with:
          path: tezave.txt
          key: preverba-javljeno-v2-${{ steps.trditve.outputs.odtis }}
          lookup-only: true
      # v2 ignores old cache entries that may have followed a failed delivery.
      - name: Javi na Discord
        id: dostava
        if: steps.trditve.outputs.odtis && (github.event_name == 'schedule' || steps.javljeno.outputs.cache-hit != 'true')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node -e '
            const besedilo = require("fs").readFileSync("tezave.txt", "utf8")
            if (!process.env.DISCORD_WEBHOOK) {
              console.error("Discord webhook ni nastavljen.")
              process.exit(1)
            }
            fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              signal: AbortSignal.timeout(15000),
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: besedilo.slice(0, 1900) }),
            }).then((o) => {
              if (!o.ok) {
                console.error(`Discord: HTTP ${o.status}`)
                process.exitCode = 1
                return
              }
              console.log("Javljeno na Discord.")
            }).catch(() => {
              // Do not log errors that may contain the secret webhook URL.
              console.error("Discord dostava ni uspela (omrezje ali casovna omejitev).")
              process.exitCode = 1
            })
          '
      - name: Zapomni si javljeni seznam
        if: success() && steps.dostava.outcome == 'success' && steps.trditve.outputs.odtis && steps.javljeno.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tezave.txt
          key: preverba-javljeno-v2-${{ steps.trditve.outputs.odtis }}
      # Razdeljena avstrijska liga (Bundesliga: Meister-/Qualifikationsgruppe)
      # dobi nadaljevanje kot novo tekmovanje pri ÖFB. Le javi z SQL, baze ne
      # spreminja; brez novosti molči. Enkrat na dan, ne po vsakem uvozu.
      - name: Nove faze avstrijskih lig
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/nova-faza-oefb.mjs
      - name: Izid
        if: steps.uvoz.outputs.tece != '1' && steps.trditve.outputs.ok != '1'
        run: exit 1
