name: Preverba podatkov

# Vsaka huda napaka v tem projektu je bila TIHA: uvoz je porocal uspeh in
# vpisal smeti, testi so bili zeleni, stran je izrisala stevilko. Enotski
# testi tega ne ujamejo, ker koda naredi natanko to, kar ji pise.
#
# Ujame jih sele trditev o podatkih samih — in ta mora teci sama od sebe,
# sicer je nihce ne pozene. Zato vsak dan po nocnem uvozu, ob tezavi pa
# sporocilo na Discord.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  # Po uvozu zapisnikov: ce je uvoz kaj pokvaril, naj se izve takoj.
  workflow_run:
    workflows: ['Uvoz zapisnikov', 'Uvoz lige (rocno)']
    types: [completed]

permissions:
  contents: read

jobs:
  preveri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      - name: Trditve o podatkih
        id: trditve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ok=1
          node scripts/preveri-podatke.mjs --izhod tezave.txt || ok=0
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ -s tezave.txt ]; then
            echo "odtis=$(sha256sum tezave.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      # Isti seznam težav gre na Discord enkrat; po vsakem uvozu znova bi
      # ob štirih ročnih uvozih prišla štiri enaka sporočila. Jutranja preverba
      # javi vedno, da odprta težava ne utone.
      - name: Ali je ta seznam že javljen
        if: steps.trditve.outputs.odtis
        id: javljeno
        uses: actions/cache/restore@v4
        with:
          path: tezave.txt
          key: preverba-javljeno-${{ steps.trditve.outputs.odtis }}
          lookup-only: true
      - name: Javi na Discord
        if: steps.trditve.outputs.odtis && (github.event_name == 'schedule' || steps.javljeno.outputs.cache-hit != 'true')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node -e '
            const besedilo = require("fs").readFileSync("tezave.txt", "utf8")
            fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: besedilo.slice(0, 1900) }),
            }).then((o) => console.log(o.ok ? "Javljeno na Discord." : `Discord: HTTP ${o.status}`))
              .catch((e) => console.log(`Discord ni dosegljiv: ${e.message}`))
          '
      - name: Zapomni si javljeni seznam
        if: steps.trditve.outputs.odtis && steps.javljeno.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tezave.txt
          key: preverba-javljeno-${{ steps.trditve.outputs.odtis }}
      - name: Izid
        if: steps.trditve.outputs.ok != '1'
        run: exit 1
