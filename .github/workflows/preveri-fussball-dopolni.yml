name: FUSSBALL reviewed transport completion
run-name: FUSSBALL Baden reviewed transport completion
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main SHA
        type: string
        required: true
      checkpoint_preset:
        description: Exact reviewed spent-history checkpoint; used presets cannot restart
        type: choice
        default: baden-reviewed-transports-v1
        options:
          - baden-reviewed-transports-v1
          - baden-reviewed-transports-v2
          - baden-reviewed-transports-v3
          - baden-reviewed-transports-v4
          - baden-reviewed-transports-v5
          - baden-reviewed-archive-v6
      current_requests:
        description: New current request ceiling (v1<=886 after1114; v2<=788 after1212; v3<=577 after1423; v4<=483 after1517; v5<=432 after1568, enter432 explicitly; archive-v6 must enter0)
        type: number
        default: 886
      archive_requests:
        description: Separately reserved archive request ceiling (1–3000)
        type: number
        default: 3000
permissions:
  contents: read
  actions: read
env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  COMPLETION_PRESET: ${{ inputs.checkpoint_preset }}
  COMPLETION_CURRENT_REQUESTS: ${{ inputs.current_requests }}
  COMPLETION_ARCHIVE_REQUESTS: ${{ inputs.archive_requests }}
jobs:
  capture:
    if: inputs.checkpoint_preset != 'baden-reviewed-archive-v6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      archive_allowed: ${{ steps.authorize.outputs.archive_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate exact reviewed completion scope and total5000 budget
        run: node scripts/fussball-completion-actions.mjs validate
      - name: Offline source and evidence checks
        run: node --test scripts/lib/fussball-capture.test.mjs scripts/test-fussball*.mjs
      - name: Authenticate only the exact reviewed source artifacts for the selected preset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fussball-completion-actions.mjs parents checkpoint-input
      - name: Share host pacing with older nightly and bulk readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bulk-source-coordination.mjs
      - name: Capture fresh rounds and missing originals without database credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fussball-completion-actions.mjs capture-current capture
      - name: Independently replay only retained original documents
        run: node scripts/zajemi-fussball-sezono.mjs verify capture
      - name: Authorize archive only from complete replayed current originals
        id: authorize
        run: node scripts/fussball-completion-actions.mjs authorize capture
      - name: Preserve source originals, checkpoint provenance and request journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fussball-season-${{ github.run_id }}
          path: capture/
          if-no-files-found: ignore
          retention-days: 90
  archive:
    needs: capture
    if: inputs.checkpoint_preset != 'baden-reviewed-archive-v6' && github.ref == 'refs/heads/main' && needs.capture.result == 'success' && needs.capture.outputs.archive_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate unchanged reviewed main and reserved allowances
        run: node scripts/fussball-completion-actions.mjs validate
      - uses: actions/download-artifact@v4
        with:
          name: fussball-season-${{ github.run_id }}
          path: current-capture/
      - name: Share host pacing with older nightly and bulk readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bulk-source-coordination.mjs
      - name: Reauthenticate and replay current proof, bind adjacent archive, capture and replay
        run: node scripts/fussball-completion-actions.mjs capture-archive current-capture
      - name: Preserve separate archive originals and request journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fussball-season-archive-${{ github.run_id }}
          path: capture-archive/
          if-no-files-found: ignore
          retention-days: 90
  handoff:
    needs: [capture, archive]
    if: inputs.checkpoint_preset != 'baden-reviewed-archive-v6' && github.ref == 'refs/heads/main' && needs.capture.result == 'success' && needs.archive.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: fussball-season-${{ github.run_id }}
          path: current-capture/
      - uses: actions/download-artifact@v4
        with:
          name: fussball-season-archive-${{ github.run_id }}
          path: archive-capture/
      - name: Require unchanged main and complete native source batches before separate native gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fussball-completion-actions.mjs handoff current-capture archive-capture

  archive-continuation:
    if: inputs.checkpoint_preset == 'baden-reviewed-archive-v6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: de77b661cbc11d95256a500e57c2fdea861a0647
          path: frozen-de77
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact archive-only V6 scope and1838 spent budget
        run: node scripts/fussball-archive-v6-actions.mjs validate
      - name: Focused offline archive continuation checks
        run: node --test scripts/test-fussball-archive-v6.mjs scripts/test-fussball-court-40641606028.mjs
      - name: Authenticate actual V5 parents and execute frozen DE77 default verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fussball-archive-v6-actions.mjs parents continuation-input frozen-de77
      - name: Exercise genuine retained originals offline before source
        env:
          FUSSBALL_V6_TEST_PARENTS: continuation-input
          FUSSBALL_V6_TEST_FROZEN: frozen-de77
        run: node --test scripts/test-fussball-archive-v6.mjs
      - name: Share host pacing with older nightly and bulk readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bulk-source-coordination.mjs
      - name: Capture only fresh archive rounds and missing originals without database credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fussball-archive-v6-actions.mjs capture continuation-input frozen-de77 capture-archive-v6
      - name: Reauthenticate detached originals and replay archive with no network
        run: node scripts/fussball-archive-v6-actions.mjs verify continuation-input frozen-de77 capture-archive-v6
      - name: Preserve V6 archive originals and all counted attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fussball-season-archive-v6-${{ github.run_id }}
          path: capture-archive-v6/
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve source-only attestation separately from immutable historical parents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fussball-archive-v6-source-attestation-${{ github.run_id }}
          path: archive-v6-source-attestation.json
          if-no-files-found: ignore
          retention-days: 90
