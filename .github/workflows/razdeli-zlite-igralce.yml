name: Razdeli zlite igralce

# Uvoz je soimenjaka drugega kluba imel za prestop, tudi kadar sta igrala
# hkrati (Petrović Lazar, rs-srpska-istok: vratar Morave in igralec Malošišta
# v istih krogih, en zapis z vsoto točk obeh). `razdeli-zlite-igralce.mjs`
# takega igralca razdeli po klubih (SQL `razdeli_zlitega_igralca`, migracija
# 20261011233100) in preračuna točke krogov. Skripta potrebuje zivi kljuc, ki
# zivi samo tu — zato tece tu.
#
# Najprej brez `pisi` (nacrt), najprej neaktivne lige (vir fsb, fss, fssid),
# nato aktivne (nzs, mnzmb, …). Brez `vir` in `tekmovanje` vse lige.
# Ponoven zagon razdeljenih ne spremeni.
on:
  workflow_dispatch:
    inputs:
      vir:
        description: 'Vir; mfa-nl2-public-capture = fixed read-only branch capture; prazno = vsi'
        required: false
        type: string
        default: ''
      tekmovanje:
        description: 'Slug ene lige (npr. rs-srpska-istok); prazno = vse lige vira'
        required: false
        type: string
        default: ''
      igralec:
        description: 'Id enega igralca (neobvezno)'
        required: false
        type: string
        default: ''
      ohrani_klub:
        description: 'Izrecno potrjen klub, ki obdrži id (zahteva tekmovanje in igralca)'
        required: false
        type: string
        default: ''
      expected_sha:
        description: 'Pri izrecnem ohrani_klub: 40-mestni SHA pregledane različice main'
        required: false
        type: string
        default: ''
      pisi:
        description: 'Zapisi (brez tega je samo nacrt)'
        required: false
        type: boolean
        default: false
      fscg_cache_audit:
        description: 'Samo lokalna analiza dveh že shranjenih zapisnikov FSCG; brez uvoza'
        required: false
        type: boolean
        default: false
      mfa_nl_cache_audit:
        description: 'Read-only retained MFA NL cache evidence; no imports or source calls'
        required: false
        type: boolean
        default: false
      mfa_nl_league:
        description: 'Exact league for retained-cache audit'
        required: false
        type: choice
        options:
          - mt-nl1
          - mt-nl2
        default: mt-nl1
      source_run_id:
        description: 'Completed first-attempt main uvoz-lige.yml run owning the exact cache'
        required: false
        type: string
        default: ''

permissions:
  contents: read

run-name: ${{ inputs.vir == 'mfa-nl2-public-capture' && 'MFA NL II public source capture' || inputs.mfa_nl_cache_audit && format('MFA NL cache audit {0} source {1}', inputs.mfa_nl_league, inputs.source_run_id) || inputs.fscg_cache_audit && 'FSCG cached-report audit' || format('Razdeli zlite igralce {0}{1}', inputs.tekmovanje || inputs.vir || 'vse', inputs.pisi && ' (pisi)' || '') }}

# Uvoz in razdelitev pisejo iste nastope: uvoz tekmo zamenja v celoti, zato
# ne smeta teci hkrati. Kot zdruzi-klube: svoja skupina, prvi korak pocaka na
# starejse zagone iz druzine uvozov.
concurrency:
  group: razdeli-zlite-igralce
  cancel-in-progress: false

jobs:
  razdeli:
    if: ${{ !inputs.fscg_cache_audit && !inputs.mfa_nl_cache_audit && inputs.vir != 'mfa-nl2-public-capture' }}
    runs-on: ubuntu-latest
    # 15 minut dela + do 120 minut cakanja na starejsi uvoz.
    timeout-minutes: 140
    permissions:
      contents: read
      actions: read
    env:
      VIR: ${{ inputs.vir }}
      TEKMOVANJE: ${{ inputs.tekmovanje }}
      IGRALEC: ${{ inputs.igralec }}
      OHRANI_KLUB: ${{ inputs.ohrani_klub }}
      PISI: ${{ inputs.pisi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript; brez njih tuja
      # koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      - name: Preveri pregledani main za izrecni popravek
        if: ${{ inputs.ohrani_klub != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "izrecni ohrani_klub je dovoljen samo na main"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha mora biti 40 malih hex znakov"; exit 1; }
          [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] || { echo "expected_sha se ne ujema z GITHUB_SHA"; exit 1; }

      - name: Pocakaj na starejse uvoze
        if: ${{ inputs.pisi }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIR_VNOS: ${{ inputs.vir }}
          TEKMOVANJE_VNOS: ${{ inputs.tekmovanje }}
        # Le uvozi iste države (glej --popravek v skripti).
        run: node scripts/cakaj-na-uvoze.mjs --popravek --vir "$VIR_VNOS" --tekmovanje "$TEKMOVANJE_VNOS"

      - name: Razdeli
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$VIR" ]; then
            [[ "$VIR" =~ ^[a-z0-9-]+$ ]] || { echo "vir: le male crke, stevke in -"; exit 1; }
            args+=(--vir "$VIR")
          fi
          if [ -n "$TEKMOVANJE" ]; then
            [[ "$TEKMOVANJE" =~ ^[a-z0-9-]+$ ]] || { echo "tekmovanje: le male crke, stevke in -"; exit 1; }
            args+=(--tekmovanje "$TEKMOVANJE")
          fi
          if [ -n "$IGRALEC" ]; then
            [[ "$IGRALEC" =~ ^[0-9]+$ ]] || { echo "igralec: id je stevilo"; exit 1; }
            args+=(--igralec "$IGRALEC")
          fi
          if [ -n "$OHRANI_KLUB" ]; then
            [[ "$OHRANI_KLUB" =~ ^[0-9]+$ ]] || { echo "ohrani_klub: id je stevilo"; exit 1; }
            [ -n "$IGRALEC" ] && [ -n "$TEKMOVANJE" ] || { echo "ohrani_klub zahteva igralec in tekmovanje"; exit 1; }
            args+=(--ohrani-klub "$OHRANI_KLUB")
          fi
          [ "$PISI" = "true" ] && args+=(--pisi)
          node scripts/razdeli-zlite-igralce.mjs "${args[@]}"

  fscg-cache-audit:
    if: ${{ inputs.fscg_cache_audit && !inputs.mfa_nl_cache_audit && inputs.vir != 'mfa-nl2-public-capture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore exact ME1 report cache without fallback
        uses: actions/cache/restore@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-me-1-cfl-39491238079
          fail-on-cache-miss: true
      - name: Parse only the two fixed cached reports
        run: node scripts/analiziraj-fscg-me1-cache.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fscg-me1-cached-report-audit-${{ github.run_id }}
          path: fscg-me1-cache-audit-output/
          if-no-files-found: error
          retention-days: 7

  mfa-nl-cache-audit:
    if: ${{ inputs.mfa_nl_cache_audit && inputs.vir != 'mfa-nl2-public-capture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      AUDIT_LEAGUE: ${{ inputs.mfa_nl_league }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source import run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'source_run_id must be numeric'; exit 1; }
          [[ "$AUDIT_LEAGUE" = mt-nl1 || "$AUDIT_LEAGUE" = mt-nl2 ]] || { echo 'unsupported league'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          node scripts/analiziraj-mfa-nl-cache.mjs --verify-run source-run.json
      - name: Restore exact retained NL cache without fallback
        id: nl-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ inputs.mfa_nl_league }}-${{ inputs.source_run_id }}
          fail-on-cache-miss: true
      - name: Require exact cache hit
        if: ${{ steps.nl-cache.outputs.cache-hit != 'true' }}
        run: echo 'Exact source-run cache missing; wait for terminal import/cache save. No fallback or provider fetch.' && exit 1
      - name: Analyze retained bytes offline
        run: |
          node scripts/analiziraj-mfa-nl-cache.mjs
          cp source-run.json mfa-nl-cache-audit-output/source-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: mfa-nl-cache-${{ inputs.mfa_nl_league }}-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mfa-nl-cache-audit-output/
          if-no-files-found: error
          retention-days: 7

  # Ephemeral reviewed branch utility. No imports, RPCs or database credentials.
  # An operator checks other MFA writers and previous refusal evidence before dispatch.
  mfa-nl2-public-capture:
    if: ${{ inputs.vir == 'mfa-nl2-public-capture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: mfa-sourcecapture
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed capture branch
        run: node scripts/zajemi-mfa-nl2-public.mjs --verify-pin
      - name: Verify optional exact previous capture run
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'source_run_id must be numeric'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          node scripts/zajemi-mfa-nl2-public.mjs --verify-resume source-run.json
      - name: Restore only exact prior capture bytes for resume
        if: ${{ inputs.source_run_id != '' }}
        id: capture-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/.predpomnilnik/mfa
          key: mfa-nl2-public-capture-${{ inputs.source_run_id }}
          fail-on-cache-miss: true
      - name: Require exact resume cache hit
        if: ${{ inputs.source_run_id != '' && steps.capture-cache.outputs.cache-hit != 'true' }}
        run: echo 'Exact prior capture cache missing; no fallback is allowed.' && exit 1
      - name: Capture fixed NL II source bytes
        id: capture
        run: node scripts/zajemi-mfa-nl2-public.mjs
      - name: Preserve resume run metadata
        if: ${{ always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        run: |
          if [ -f source-run.json ] && [ -d mfa-nl2-public-capture-output ]; then
            cp source-run.json mfa-nl2-public-capture-output/resume-source-run.json
          fi
      - name: Save partial or complete capture cache
        if: ${{ always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: scripts/.predpomnilnik/mfa
          key: mfa-nl2-public-capture-${{ github.run_id }}
      - name: Preserve partial or complete capture evidence
        if: ${{ always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: mfa-nl2-public-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: mfa-nl2-public-capture-output/
          if-no-files-found: error
          retention-days: 7
