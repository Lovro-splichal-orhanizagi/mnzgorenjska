name: Zdruzi podvojena kluba

# Isti klub je v bazi dvakrat, kadar ga vir v novi sezoni ali selekciji
# zapise drugace. `zdruzi-klube.mjs` preseli igralce, nastope, gole in tekme
# na obdrzani zapis in odvecnega izbrise. Skripta potrebuje zivi kljuc, ki
# zivi samo tu — zato tece tu. Najprej brez `pisi` za predogled.
#
# Vzdevek za novo ime kluba dodaj v slovar vira (scripts/viri/*.mjs),
# sicer ga naslednji uvoz ustvari znova.
on:
  workflow_dispatch:
    inputs:
      odvecni:
        description: 'id kluba, ki se izbrise'
        required: true
        type: number
      obdrzi:
        description: 'id kluba, ki ostane (ime, grb, zgodovina)'
        required: true
        type: number
      pisi:
        description: 'Zapisi (brez tega je samo predogled)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Klubi so skupni vsem ligam in uvoz si ob zagonu zapomni id-je klubov — ce
# mu medtem enega izbrisemo, tekme obvisijo. Zato ne sme teci hkrati z
# nobenim uvozom. Prej je bil v skupni skupini `uvoz`, kjer ga je nocni cron
# izpodrinil iz vrste; zdaj ima svojo, prvi korak pa pocaka na starejse
# zagone iz druzine uvozov (glej uvoz-zapisnikov.yml).
concurrency:
  group: zdruzi-klube
  cancel-in-progress: false

jobs:
  zdruzi:
    runs-on: ubuntu-latest
    # 15 minut dela + do 120 minut cakanja na starejsi uvoz.
    timeout-minutes: 140
    permissions:
      contents: read
      actions: read
    env:
      ODVECNI: ${{ inputs.odvecni }}
      OBDRZI: ${{ inputs.obdrzi }}
      PISI: ${{ inputs.pisi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      # Druzina uvozov (uvoz-zapisnikov, uvoz-lige, zdruzi-klube,
      # tedensko-cene) pise v iste tabele: klube, igralce, tekme, cene. Zato
      # tecejo po vrsti — po casu zacetka, brez izpodrivanja.
      - name: Pocakaj na starejse uvoze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MOJ=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt --jq .startedAt)
          for i in $(seq 1 120); do
            n=0
            for wf in uvoz-zapisnikov.yml uvoz-lige.yml zdruzi-klube.yml tedensko-cene.yml; do
              # Brez --status: tudi cakajoci (queued) starejsi zagon mora priti
              # prvi. Zato vec kot 20 — koncani zagoni zasedejo del seznama.
              k=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 50 \
                --json databaseId,startedAt,status \
                --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID and .startedAt > \"2000\" and (.startedAt < \"$MOJ\" or (.startedAt == \"$MOJ\" and .databaseId < $GITHUB_RUN_ID)))] | length")
              n=$((n + k))
            done
            [ "$n" -eq 0 ] && exit 0
            echo "Pred mano tece se $n uvozov — cakam ($i/120 min)"
            sleep 60
          done
          echo "::error::Starejsi uvoz tece ze dve uri."
          exit 1
      - name: Zdruzi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$ODVECNI" =~ ^[0-9]+$ && "$OBDRZI" =~ ^[0-9]+$ ]] || { echo "id morata biti stevili"; exit 1; }
          [ "$ODVECNI" != "$OBDRZI" ] || { echo "isti id dvakrat: klub bi izginil"; exit 1; }
          if [ "$PISI" = "true" ]; then
            node scripts/zdruzi-klube.mjs --odvecni "$ODVECNI" --obdrzi "$OBDRZI" --pisi
          else
            node scripts/zdruzi-klube.mjs --odvecni "$ODVECNI" --obdrzi "$OBDRZI"
          fi
