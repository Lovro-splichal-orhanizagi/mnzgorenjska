name: Zdruzi podvojena kluba

# Isti klub je v bazi dvakrat, kadar ga vir v novi sezoni ali selekciji
# zapise drugace. `zdruzi-klube.mjs` preseli igralce, nastope, gole in tekme
# na obdrzani zapis in odvecnega izbrise. Skripta potrebuje zivi kljuc, ki
# zivi samo tu — zato tece tu. Najprej brez `pisi` za predogled.
#
# Vzdevek za novo ime kluba dodaj v slovar vira (scripts/viri/*.mjs),
# sicer ga naslednji uvoz ustvari znova.
on:
  workflow_dispatch:
    inputs:
      nacin:
        description: 'Standardna zdruzitev ali enkratno dokazano popravilo FCF G13'
        required: false
        type: choice
        options: [standard, fcf-g13]
        default: standard
      approved_sha256:
        description: 'FCF G13 apply: pregledani SHA256 iz predogleda (sicer prazno)'
        required: false
        type: string
        default: ''
      odvecni:
        description: 'id kluba, ki se izbrise'
        required: true
        type: number
      obdrzi:
        description: 'id kluba, ki ostane (ime, grb, zgodovina)'
        required: true
        type: number
      pisi:
        description: 'Zapisi (brez tega je samo predogled)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Klubi so skupni vsem ligam in uvoz si ob zagonu zapomni id-je klubov — ce
# mu medtem enega izbrisemo, tekme obvisijo. Zato ne sme teci hkrati z
# nobenim uvozom. Prej je bil v skupni skupini `uvoz`, kjer ga je nocni cron
# izpodrinil iz vrste; zdaj ima svojo, prvi korak pa pocaka na starejse
# zagone iz druzine uvozov (glej uvoz-zapisnikov.yml).
concurrency:
  group: zdruzi-klube
  cancel-in-progress: false

jobs:
  zdruzi:
    if: inputs.nacin != 'fcf-g13'
    runs-on: ubuntu-latest
    # 15 minut dela + do 120 minut cakanja na starejsi uvoz.
    timeout-minutes: 140
    permissions:
      contents: read
      actions: read
    env:
      ODVECNI: ${{ inputs.odvecni }}
      OBDRZI: ${{ inputs.obdrzi }}
      PISI: ${{ inputs.pisi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      # Druzina uvozov (uvoz-zapisnikov, uvoz-lige, zdruzi-klube,
      # tedensko-cene) pise v iste tabele: klube, igralce, tekme, cene. Zato
      # tecejo po vrsti — po casu zacetka, brez izpodrivanja.
      - name: Pocakaj na starejse uvoze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MOJ=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt --jq .startedAt)
          for i in $(seq 1 120); do
            n=0
            for wf in uvoz-paketa-lig.yml reviewed-existing-history.yml mlsz-reviewed-history.yml mfa-nl-reviewed-history.yml mfa-challenge-reviewed-history.yml mfa-reviewed-history.yml uvoz-hr-zenske.yml uvoz-zapisnikov.yml uvoz-lige.yml uvoz-fussball-public.yml uvoz-dribl-public.yml uvoz-dfb-regije.yml vklop-dfb-regije.yml vklop-katalonije.yml vklop-obstojecih-lig.yml uskladi-pozicije.yml izstop-kluba.yml cene-lig.yml zdruzi-klube.yml tedensko-cene.yml razdeli-zlite-igralce.yml; do
              # Brez --status: tudi cakajoci (queued) starejsi zagon mora priti
              # prvi. Zato vec kot 20 — koncani zagoni zasedejo del seznama.
              k=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 50 \
                --json databaseId,startedAt,status,displayTitle \
                --jq "[.[] | select(.status != \"completed\" and (\"$wf\" != \"mfa-reviewed-history.yml\" or (.displayTitle | test(\"^MFA reviewed history (prepare|preview|receipt) mt-premier$\") | not)) and .databaseId != $GITHUB_RUN_ID and .startedAt > \"2000\" and (.startedAt < \"$MOJ\" or (.startedAt == \"$MOJ\" and .databaseId < $GITHUB_RUN_ID)))] | length")
              n=$((n + k))
            done
            [ "$n" -eq 0 ] && exit 0
            echo "Pred mano tece se $n uvozov — cakam ($i/120 min)"
            sleep 60
          done
          echo "::error::Starejsi uvoz tece ze dve uri."
          exit 1
      - name: Zdruzi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$ODVECNI" =~ ^[0-9]+$ && "$OBDRZI" =~ ^[0-9]+$ ]] || { echo "id morata biti stevili"; exit 1; }
          [ "$ODVECNI" != "$OBDRZI" ] || { echo "isti id dvakrat: klub bi izginil"; exit 1; }
          if [ "$PISI" = "true" ]; then
            node scripts/zdruzi-klube.mjs --odvecni "$ODVECNI" --obdrzi "$OBDRZI" --pisi
          else
            node scripts/zdruzi-klube.mjs --odvecni "$ODVECNI" --obdrzi "$OBDRZI"
          fi

  fcf-g13:
    if: inputs.nacin == 'fcf-g13'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      ODVECNI: ${{ inputs.odvecni }}
      OBDRZI: ${{ inputs.obdrzi }}
      PISI: ${{ inputs.pisi }}
      APPROVED_SHA256: ${{ inputs.approved_sha256 }}
      MIGRACIJE_PREMOR: ${{ vars.MIGRACIJE_PREMOR }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Runner rejects any ref except refs/heads/main before credentials/SQL.
      - name: Fiksni vhod in veja main
        run: node scripts/fcf-g13-repair.mjs --check
      - name: Predpogoji baze
        id: baza
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ "$MIGRACIJE_PREMOR" != "1" ] || { echo "::error::MIGRACIJE_PREMOR=1"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "::error::Manjka povezava baze"; exit 1; }
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Manjka predpogoj cakanja"; exit 1; }
          command -v psql >/dev/null || { echo "::error::Manjka psql"; exit 1; }
          case "$SUPABASE_DB_URL" in *@127.0.0.1*)
            test -n "$KLJUC" && test -n "$ZNANI" || { echo "::error::Manjka predpogoj tunela"; exit 1; }
            echo "tunel=da" >> "$GITHUB_OUTPUT";; esac
      - name: Pocakaj na starejse ES uvoze
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cakaj-na-uvoze.mjs --drzava ES --najvec 300
      - name: Tunel do baze na VM
        if: steps.baza.outputs.tunel == 'da'
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -L 5432:127.0.0.1:5432 deploy@2.31.6.53
      - name: Atomski FCF G13 predogled ali apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/fcf-g13-repair.mjs
      - name: Dokaz popravila
        if: always() && hashFiles('fcf-g13-repair/result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fcf-g13-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: fcf-g13-repair/result.json
          if-no-files-found: error
          retention-days: 14
