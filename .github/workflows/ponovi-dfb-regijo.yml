name: Ponovitev DFB regije iz izvirnega zajema
run-name: Ponovitev DFB ${{ inputs.liga }} ${{ inputs.season }}
on:
  workflow_dispatch:
    inputs:
      liga:
        type: choice
        required: true
        options: [de-regionalliga-nord, de-regionalliga-west, de-regionalliga-suedwest, de-regionalliga-bayern]
      season:
        type: choice
        required: true
        options: ['2025/26', '2026/27']
      capture_run:
        description: Izvirni dejanski zajem
        type: string
        required: true
      capture_commit:
        description: Celotni pregledani SHA izvirnega zajema
        type: string
        required: true
      historical_policy:
        description: Pregledana zgodovinska politika; none ohrani strogo ponovitev
        type: choice
        options: ['none', 'de-dfb-suedwest-2025-historical-unavailable-v1', 'de-dfb-nord-2025-historical-unavailable-v1', 'de-dfb-west-prelaunch-unavailable-v2']
        default: 'none'
      first_fantasy_day:
        description: Predlagani datum dejanske prve fantasy tekme; samo za politiko
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: dfb-replay-${{ inputs.liga }}-${{ inputs.season }}
  cancel-in-progress: false
jobs:
  replay:
    name: DFB regionalni replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGA: ${{ inputs.liga }}
      SEASON: ${{ inputs.season }}
      CAPTURE_RUN: ${{ inputs.capture_run }}
      CAPTURE_COMMIT: ${{ inputs.capture_commit }}
      HISTORICAL_POLICY: ${{ inputs.historical_policy }}
      FIRST_FANTASY_DAY: ${{ inputs.first_fantasy_day }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Preveri izbiro zgodovinske politike
        run: |
          case "$HISTORICAL_POLICY" in
            none) test -z "$FIRST_FANTASY_DAY" ;;
            de-dfb-suedwest-2025-historical-unavailable-v1)
              test "$LIGA" = de-regionalliga-suedwest
              [[ "$FIRST_FANTASY_DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] ;;
            de-dfb-nord-2025-historical-unavailable-v1)
              test "$HISTORICAL_POLICY" = "de-dfb-${LIGA#de-regionalliga-}-2025-historical-unavailable-v1"
              [[ "$FIRST_FANTASY_DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] ;;
            de-dfb-west-prelaunch-unavailable-v2)
              test "$LIGA" = de-regionalliga-west
              [[ "$FIRST_FANTASY_DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] ;;
            *) exit 1 ;;
          esac
      - name: Preveri izvirni posel in SHA prenesenega arhiva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HISTORICAL_POLICY" = none ]; then
            node scripts/ponovi-dfb-regijo.mjs capture "$LIGA" "$SEASON" "$CAPTURE_RUN" "$CAPTURE_COMMIT" original parent.json
          else
            node scripts/ponovi-dfb-regijo.mjs capture-policy "$LIGA" "$SEASON" "$CAPTURE_RUN" "$CAPTURE_COMMIT" original parent.json "$FIRST_FANTASY_DAY"
          fi
      - name: Ponovi sezono — brez omrežja in baze
        if: ${{ inputs.historical_policy == 'none' }}
        run: |
          set -euo pipefail
          sudo -E unshare --net -- node scripts/ponovi-dfb-regijo.mjs replay "$LIGA" "$SEASON" original parent.json replay
      - name: Ponovi sezono s pregledano zgodovinsko politiko — brez omrežja in baze
        if: ${{ inputs.historical_policy != 'none' }}
        run: |
          set -euo pipefail
          sudo -E unshare --net -- node scripts/ponovi-dfb-regijo.mjs replay-policy "$LIGA" "$SEASON" original parent.json replay
      - name: Ime dokaza
        id: artifact
        run: |
          echo "name=dfb-regional-replay-${LIGA#de-}-${SEASON:0:4}" >> "$GITHUB_OUTPUT"
      - name: Preverjena ponovitev
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: replay/
          if-no-files-found: error
          retention-days: 90
