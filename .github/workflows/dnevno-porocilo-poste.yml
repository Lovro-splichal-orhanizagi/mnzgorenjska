name: Dnevno porocilo poste

# Koliko mailov je vceraj odslo (klubom in uporabnikom), po posiljatelju,
# drzavi in vrsti — na Discord #reports.
#
# Ob 7:00 po slovenskem casu poleti (5:00 UTC), pozimi ob 6:00.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  porocilo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dnevno porocilo poste
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
        run: node scripts/dnevno-porocilo-poste.mjs --discord

      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
        run: node scripts/javi-napako.mjs "Dnevno porocilo poste"
