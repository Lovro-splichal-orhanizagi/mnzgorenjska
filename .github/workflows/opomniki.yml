name: Opomniki brez ekipe

# `posli-opomnik` obstaja in dela — 195 poslanih — a ga sprozi GUMB v
# administraciji. Zato je zadnji opomnik odsel 3. septembra in nato nic: ne
# zato, ker bi bil pokvarjen, ampak ker ga ni nihce pritisnil. Uporabniki brez
# ekipe so najvecje puscanje, v novih ligah pa so to skoraj vsi.
#
# URNIK JE VKLOPLJEN 7. 10. 2026 (odlocitev lastnika): 852 racunov je bilo brez
# ekipe in nihce ni dobil maila. Vsak dan ob 8:17 UTC najvec 150 mailov, ker
# je mail.slff.eu nov posiljatelj in si mora ugled pri Gmailu ustvariti
# postopoma (strezik nosi tudi posto HelpStacka).
#
# Varovala: istemu cloveku najvec trikrat skupaj in ne pogosteje kot na sedem
# dni (`nedavni_opomnik`); vsak mail ima odjavo brez prijave (`odjavi_z_zetonom`),
# kdor se odjavi (`brez_opomnikov`), ne dobi nicesar vec.
# Rocni zagon je se vedno privzeto suh.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      suho:
        description: 'Samo presteje, ne posilja'
        required: false
        default: true
        type: boolean
      najvec_poslati:
        description: 'Največ poslanih v tem zagonu (dnevna kvota ponudnika)'
        required: false
        default: '150'
        type: string

permissions:
  contents: read

concurrency:
  group: opomniki
  cancel-in-progress: false

jobs:
  opomniki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Po urniku posilja (inputs so takrat prazni), rocno privzeto suho.
      SUHO: ${{ github.event_name == 'schedule' && 'false' || inputs.suho }}
      NAJVEC_POSLATI: ${{ inputs.najvec_poslati || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      - name: Posli opomnike po ligah
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/posli-opomnike.mjs
