# NEVER MERGE: dedicated secret-free full-schema scratch SQL validation only.
name: Baden cold source version scratch SQL - never merge
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic head
        required: true
        type: string
permissions: {}
concurrency:
  group: baden-cold-version-scratch-sql
  cancel-in-progress: false
jobs:
  baden_version_sql:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/baden-g1-cold-version-sql-review-probe-20261030' && github.run_attempt == 1 && inputs.expected_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Source-free boundary and clone tests
        run: node --test scripts/test-baden-cold-source-version.mjs scripts/test-baden-cold-source-version-sql.mjs
      - name: Full fresh migration chain in hosted scratch database
        run: npx --yes supabase@2.117.0 db start
      - name: Actual owner transition role rollback concurrency and conservation SQL
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          BADEN_COLD_VERSION_FULL_CI_SQL_TEST: '1'
          BADEN_COLD_VERSION_DISPOSABLE_FULL_DB: '1'
        run: node --test scripts/test-baden-cold-source-version-sql.mjs
      - name: Actual G1 and G9 read-only native capture over populated Baden M2
        run: docker exec -i supabase_db_mnzgorenjska psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f /dev/stdin < supabase/tests/baden-version-scratch-fcf-capture.sql
