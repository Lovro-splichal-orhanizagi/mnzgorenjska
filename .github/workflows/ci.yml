# NEVER MERGE: secret-free full fresh G1 SQL validation only.
name: G1 native800 scratch SQL - never merge
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic head
        required: true
        type: string
permissions: {}
concurrency:
  group: g1-native800-scratch-sql
  cancel-in-progress: false
jobs:
  varnost:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/g1-native800-sql-diagnostic-20261030' && github.run_attempt == 1 && inputs.expected_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Source-free G1 SQL profile and fixed hosted target tests
        run: node --test --test-concurrency=1 scripts/test-fcf-g1-native800-sql-profile.mjs scripts/test-fcf-g1-native800-sql.mjs
      - name: Full fresh migration chain in hosted scratch database
        run: npx --yes supabase@2.117.0 db start
      - name: Actual G1 import pricing launch roles rollback concurrency SQL
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          FCF_G1_NATIVE800_CI_SQL_TEST: '1'
          FCF_G1_NATIVE800_DISPOSABLE_DB: '1'
        run: node --test --test-concurrency=1 scripts/test-fcf-g1-native800-sql.mjs
