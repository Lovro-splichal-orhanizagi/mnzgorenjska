name: NEVERMERGE Baden broker transition OBSERVATION ONLY
on:
  workflow_dispatch:
    inputs:
      expected_sha: {required: true, type: string}
permissions: {contents: read, actions: read}
jobs:
  refresh:
    if: github.ref == 'refs/heads/codex/baden-r10-broker-transition-probe-20261030' && github.run_attempt == 1 && github.actor_id == '25134229' && github.actor == 'nejcar20' && github.triggering_actor == 'nejcar20' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout fixed main
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install locked dependencies
        run: echo 'NO_PROVIDER dummy; no npm transport'
      - name: Restore reviewed native seed
        run: echo 'NO_PROVIDER dummy; no source cache or native context'
      - name: Prepare private fixed5000 native remainder
        run: |
          set -euo pipefail
          mkdir -p baden-r10-broker-probe
          node scripts/baden-r10-broker-transition-probe.mjs broker > baden-r10-broker-probe/broker.log 2>&1 &
          pid=$!
          for i in $(seq 1 450); do
            test -f "$RUNNER_TEMP/baden-r10-refresh-$GITHUB_RUN_ID.sock.ready" && exit 0
            if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; exit 1; fi
            sleep 1
          done
          exit 1
      - name: Capture fixed Baden native refresh
        run: node scripts/baden-r10-broker-transition-probe.mjs capture > baden-r10-broker-probe/capture.log 2>&1
      - name: Verify counted native refresh originals
        run: echo 'NO_PROVIDER dummy; no source originals/proof'
      - name: Publish exact native refresh cache
        run: echo 'NO_PROVIDER dummy; no source cache publish'
      - name: Preserve durable native refresh cache
        run: echo 'NO_PROVIDER dummy; no cache save'
      - name: Retain all counted attempts and partial originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baden-r10-broker-observation-${{ github.run_id }}-1
          path: baden-r10-broker-probe/
          if-no-files-found: error
          retention-days: 90
