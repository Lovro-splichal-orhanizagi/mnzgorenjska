name: GitHub token diagnostic (NEVER MERGE)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen diagnostic branch head SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  token-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex-github-token-diagnostic-e925-20261030' && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20' && github.run_attempt == 1 && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed GitHub API read diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/diagnose-github-token.mjs
      - name: Preserve sanitized diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-token-diagnostic-${{ github.run_id }}
          path: github-token-diagnostic.json
          if-no-files-found: error
          retention-days: 3
