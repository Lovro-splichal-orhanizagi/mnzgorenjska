name: NEVER-MERGE G9 served-fetch diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen diagnostic commit
        required: true
        type: string
      expected_main_sha:
        description: Expected production main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  served-fetch-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex-g9-served-fetch-diagnostic-20261030' && github.actor == 'nejcar20' && github.triggering_actor == 'nejcar20' && github.run_attempt == 1 && inputs.expected_sha == github.sha && inputs.expected_main_sha == 'a760cfaea30c458d38886273f65f232fedd08edf'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-free fixed-request checks
        run: node --test scripts/test-diagnose-g9-served-fetch.mjs
      - name: Verify actual run and main, then fixed own-site transport only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/diagnose-g9-served-fetch.mjs > diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g9-served-fetch-diagnostic-${{ github.run_id }}
          path: diagnostic.json
          if-no-files-found: error
          retention-days: 7
