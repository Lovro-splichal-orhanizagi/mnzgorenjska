name: CI

# Do zdaj se ob commitu ni preverjalo nič — ne tipi, ne build, ne izris.
# Vsako preverjanje je teklo samo na razvijalčevem računalniku.

on:
  push:
    branches: [main]
  pull_request:
  # Za zagone, ki jih sprozi drug delovni tok (grbi z NZS potisnejo z
  # GITHUB_TOKEN, ki CI ne sprozi sam).
  workflow_dispatch:
    inputs:
      vir:
        description: Javni vir za podatkovni audit
        type: choice
        options: [all, novanet, dfb]
        default: all
      sezona:
        description: Tekoča sezona, arhiv ali obe
        type: choice
        options: [all, current, archive]
        default: all
      diagnostika:
        description: Samo dva fiksna javna dokumenta, brez celotnega audita
        type: boolean
        default: false

permissions:
  contents: read

# Nov push na isto vejo prekine prejšnji tek — zadnje stanje je edino, ki šteje.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.vir || 'code' }}-${{ inputs.sezona || 'all' }}-${{ inputs.diagnostika && 'diagnostic' || 'normal' }}
  cancel-in-progress: true

jobs:
  novi-viri:
    if: github.event_name == 'workflow_dispatch' && !inputs.diagnostika && startsWith(github.ref, 'refs/heads/codex/spain-germany-production')
    uses: ./.github/workflows/preveri-nova-vira.yml
    with:
      vir: ${{ inputs.vir || 'all' }}
      sezona: ${{ inputs.sezona || 'all' }}

  diagnostika-virov:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostika
    uses: ./.github/workflows/diagnostika-javnih-virov.yml
    with:
      vir: ${{ inputs.vir == 'dfb' && 'fussball' || inputs.vir || 'all' }}

  preveri:
    if: ${{ !inputs.diagnostika }}
    name: Tipi, build, izris
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Replay provenance tests read the immutable original parser commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS), tudi vite/rolldown ne — nativni paketi pridejo kot
      # optionalDependencies. Brez skript tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      # `npm run build` že poganja `tsc --noEmit`, a ločen korak pove, KATERI
      # od obeh je padel, brez brskanja po dnevniku.
      - name: Germany activation manifest
        run: node --test scripts/test-dfb-west-prelaunch-proof.mjs scripts/test-dfb-historical-policy.mjs scripts/test-dfb-historical-provider.mjs scripts/lib/historical-statistics-policy.test.mjs scripts/lib/historical-statistics-installed.test.mjs scripts/lib/historical-statistics-runtime.test.mjs scripts/test-dfb-calendar.mjs scripts/test-dfb-nord-west-historical.mjs scripts/test-vklop-nemcije.mjs scripts/test-zagona-nemcije.mjs scripts/test-vklop-dfb-regije.mjs scripts/test-dfb-regije-dokazi.mjs scripts/test-dfb-regije-replay.mjs scripts/test-dfb-west-clock.mjs scripts/test-current-player-reactivation.mjs scripts/test-predpomnjen-vratar.mjs scripts/test-dfb-current-reactivation.mjs

      - name: German amateur source collection and offline evidence
        run: node --test scripts/lib/fussball-capture.test.mjs scripts/test-fussball*.mjs

      - name: Existing leagues batch catch-up (source-free)
        run: node --test scripts/test-mlsz-reviewed-runtime.mjs scripts/test-mlsz-history-operator.mjs scripts/test-mlsz-transport.mjs scripts/test-vklop-obstojecih-lig.mjs scripts/test-refresh-existing-leagues.mjs scripts/test-missing-report-import.mjs scripts/test-eps-missing-reports.mjs scripts/test-hlf-missing-reports.mjs

      - name: FCF closed evidence and current-only packet
        run: node --test scripts/test-fcf-single-source-proof.mjs scripts/test-fcf-current-source-proof.mjs scripts/test-fcf-history-evidence.mjs scripts/test-fcf-historical-release.mjs scripts/test-fcf-final-audit-plan.mjs scripts/test-fcf-history-cache-proof.mjs

      # Public CI lacks the private retained marker originals: only explicitly
      # marked private-fixture positive replays skip; synthetic rejection tests run.
      - name: FCF missing inventory and authenticated target admission (source-free)
        run: node --test scripts/test-fcf-held-parent-accounting.mjs scripts/test-fcf-g9-held-parent-plan.mjs scripts/test-fcf-g9-held-parent-claim.mjs scripts/test-fcf-g9-held-parent-capture.mjs scripts/test-fcf-g9-held-parent-evidence.mjs scripts/test-fcf-g9-held-parent-actions.mjs scripts/test-fcf-g9-held-parent-workflow.mjs scripts/test-fcf-missing-inventory-plan.mjs scripts/test-fcf-missing-inventory-claim.mjs scripts/test-fcf-missing-inventory-capture.mjs scripts/test-fcf-missing-inventory-evidence.mjs scripts/test-fcf-missing-inventory-actions.mjs scripts/test-fcf-missing-inventory-workflow.mjs scripts/test-fcf-inventory-source-coordination.mjs scripts/test-fcf-missing-inventory-admission.mjs scripts/test-cakaj-na-uvoze.mjs scripts/test-fcf-history-cache-export.mjs scripts/test-fcf-target-evidence.mjs scripts/test-fcf-target-release.mjs

      - name: FCF six reviewed source/accounting/policy protocols (source-free)
        run: npm run test:fcf-six

      - name: FCF native target offline planning (source-free)
        run: node --test scripts/test-fcf-target-native-plan.mjs scripts/test-fcf-target-native-adapter.mjs scripts/test-fcf-target-offline.mjs

      - name: HNS public parser, packet, runtime and activation guards
        run: npm run test:hns-women

      - name: Tipi
        run: npx tsc --noEmit

      - name: Preverjen vklop Katalonije
        run: node --test scripts/test-vklop-katalonije.mjs

      - name: Nadzorovana FCF osvezitev
        run: node --test scripts/test-osvezi-fcf-predpomnilnik.mjs

      - name: Build
        run: npm run build

      # Posodobitev mobilne aplikacije (OTA): pokvarjen zip bi aplikacija
      # prenesla in se vrnila na staro — raje pade build.
      - name: OTA svežnj
        run: |
          unzip -tq dist/app/*.zip
          node -e "const j=require('./dist/app/latest.json'); if(!j.version||!j.checksum||!(j.minBuild>=1)) process.exit(1)"
          unzip -l dist/app/*.zip | grep -q ' index.html$'

      # Strežnik HTML (scripts/hetzner/html/): vpis v predlogo, 404, varovalo; in da
      # build zapiše nize zanj.
      - name: Strežnik HTML
        run: |
          npm run preizkus-html
          node -e "const b=require('./dist/html-besede.json'); if(!b.sk?.['tekme.tabela.zavihek']) process.exit(1)"

      # Strežnik slik za predogled (scripts/hetzner/predogledi/): vse vrste slik,
      # privzeta slika ob napaki, zavrnjeni id-ji, omejen predpomnilnik; in nizi zanj.
      - name: Slike za predogled
        run: |
          npm run preizkus-predogledov
          node -e "const b=require('./dist/html-besede.json'); if(!b.hy?.['igralci.kartica.stat']?.gol) process.exit(1)"

      # Smoke izriše vse strani na strežniku in preveri pravila točkovanja in
      # sestave ekipe. Baze ne potrebuje: poizvedbe ob izrisu ne blokirajo,
      # zato zadošča veljaven (a izmišljen) URL.
      - name: Izris vseh strani + pravila
        run: npm run smoke
        env:
          VITE_SUPABASE_URL: https://primer.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_ni_pravi_kljuc

      # SLFF Scout (scout/): sveženj in izris strani brez baze.
      - name: Scout
        run: npm run build:scout && npm run smoke:scout
        env:
          VITE_SUPABASE_URL: https://primer.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_ni_pravi_kljuc

      # SLFF Trgovina (shop/): sveženj in izris strani brez baze.
      - name: Trgovina
        run: npm run build:shop && npm run smoke:shop
        env:
          VITE_SUPABASE_URL: https://primer.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_ni_pravi_kljuc

  varnost:
    if: ${{ !inputs.diagnostika }}
    name: Pravice in roki v svezi bazi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS), tudi vite/rolldown ne — nativni paketi pridejo kot
      # optionalDependencies. Brez skript tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      # Zagon same baze preveri celotno verigo migracij na praznem Postgresu.
      - run: npx --yes supabase@2.117.0 db start
      - name: MFA NL closed archive bootstrap rollback regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          MFA_NL_BOOTSTRAP_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-mfa-nl-bootstrap-sql.mjs
      - name: MFA NL closed source/import/prices/release rollback regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          MFA_NL_RELEASE_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-mfa-nl-release-sql.mjs
      - name: MFA Challenge four-report cleanup and release rollback regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          MFA_CHALLENGE_HISTORY_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-mfa-challenge-reviewed-history-sql.mjs
      - name: MFA reviewed two-report cleanup and release rollback regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          MFA_HISTORY_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-mfa-reviewed-history-sql.mjs
      - name: Ordinary match writes under the real importer role
        run: docker exec -i supabase_db_mnzgorenjska psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 < supabase/tests/match-result-check-acl.sql
      - name: Guarded cross-club identity correction
        run: docker exec -i supabase_db_mnzgorenjska psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 < supabase/tests/zlite-identity-repair.sql
      - name: HNS canonical release, target ACLs and waiting writers
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          HNS_WOMEN_DISPOSABLE_TEST: '1'
        run: npm run test:hns-women-ci
      - name: Germany activation guard in fresh database
        run: node scripts/test-vklop-nemcije-sql.mjs
      - name: MLSZ reviewed historical cleanup and activation
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          MLSZ_HISTORY_DISPOSABLE_TEST: '1'
        run: node scripts/test-mlsz-reviewed-history-sql.mjs
      - name: Reviewed existing league history cleanup, pricing and activation rollback
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          REVIEWED_EXISTING_DISPOSABLE_TEST: '1'
        run: node scripts/test-reviewed-existing-history-sql.mjs
      - name: BiH one-time prelaunch deadline configuration rollback
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          BA_PRELAUNCH_DEADLINE_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-ba-prelaunch-deadline-sql.mjs
      - name: Regional DFB gate and concurrent writes
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
        run: |
          node scripts/test-dfb-strict-policy-activation-sql.mjs
          node scripts/test-vklop-dfb-regije-sql.mjs
          node scripts/test-dfb-regije-locks.mjs
          node scripts/test-dfb-calendar-release-sql.mjs
          node scripts/test-dfb-nord-west-historical-sql.mjs
          node scripts/test-dfb-historical-release-sql.mjs
          node scripts/test-dfb-historical-locks.mjs
          node scripts/test-dfb-current-reactivation-sql.mjs
      - name: Reviewed historical statistics and concurrent fixture identities
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          HISTORICAL_STATISTICS_DISPOSABLE_TEST: '1'
        run: |
          node scripts/test-historical-statistics-sql.mjs
          node scripts/test-historical-statistics-race.mjs
      - name: Reviewed FCF cleanup, waiting writers and exact TEXT transport
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          FCF_HISTORY_DISPOSABLE_TEST: '1'
        run: |
          node scripts/test-fcf-historical-sql.mjs
          node scripts/test-fcf-historical-race.mjs
          node scripts/test-fcf-target-sql.mjs
      - name: FCF native target import, pricing gate and independent activation
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          FCF_HISTORY_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-fcf-target-sql.mjs
      - name: FCF six reviewed native cleanup and independent target activation
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          FCF_HISTORY_DISPOSABLE_TEST: '1'
        run: node --test scripts/test-fcf-six-native-sql.mjs
      - name: Reviewed English source-calendar native regression
        run: docker exec -i supabase_db_mnzgorenjska psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 < supabase/tests/sfl-d1-calendar.sql
      - run: npm run test:varnost
      - run: npm run test:socasnost
      # Zamrznitev cene ob poškodbi: borza in kazen na sestavljenih krogih.
      - run: npm run preizkus-zamrznitve
      # Objave: brez mladinskih lig, anonimiziranih igralcev in hišnih ekip.
      - run: npm run preizkus-objav
      # Last: concurrency fixtures commit only into this disposable database.
      - name: FCF G13 atomic repair and concurrent foreign keys
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          FCF_G13_DISPOSABLE_TEST: '1'
        run: node scripts/test-fcf-g13-sql.mjs
      - if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup

  # Migracije gredo v produkcijsko bazo samodejno, PRED objavo strani. 6. 10.
  # 2026 je stran že brala tabelo `obiski_dnevno`, ki je baza še ni imela —
  # koda se je objavila sama, migracijo pa bi moral nekdo pognati na roke.
  #
  # Kam: skrivnost SUPABASE_DB_URL (Postgres URI, npr.
  # postgresql://postgres:<geslo>@<gostitelj>:5432/postgres). Ob selitvi na
  # lasten strežnik se zamenja le ta skrivnost. Med selitvijo (dump → restore)
  # nastavi spremenljivko repozitorija MIGRACIJE_PREMOR=1, da se nič ne zapiše
  # v staro bazo, ki se ravno kopira.
  #
  # Migracije so v `varnost` že preizkušene na sveži bazi. `db push` uveljavi
  # le tiste, ki jih baza še nima; vsaka teče v svoji transakciji.
  migracije:
    name: Migracije baze
    needs: [preveri, varnost]
    if: inputs.diagnostika != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ali je baza nastavljena?
        id: baza
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PREMOR: ${{ vars.MIGRACIJE_PREMOR }}
        run: |
          if [ "$PREMOR" = "1" ]; then
            echo "::warning::MIGRACIJE_PREMOR=1 — migracije preskočene (selitev baze?)."
            echo "gremo=ne" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Manjka skrivnost SUPABASE_DB_URL — migracije niso uveljavljene, poženi db push na roke."
            echo "gremo=ne" >> "$GITHUB_OUTPUT"
          else
            echo "gremo=da" >> "$GITHUB_OUTPUT"
            case "$SUPABASE_DB_URL" in *@127.0.0.1*) echo "tunel=da" >> "$GITHUB_OUTPUT";; esac
          fi

      # Baza na Hetzner VM ni javna (Postgres posluša na 127.0.0.1). Ko
      # SUPABASE_DB_URL kaže na 127.0.0.1, gre CI do nje skozi SSH tunel s
      # ključem za objavo (ta sme odpreti samo 127.0.0.1:5432).
      - name: Tunel do baze na VM
        if: steps.baza.outputs.tunel == 'da'
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -L 5432:127.0.0.1:5432 deploy@2.31.6.53

      - name: Katere migracije čakajo
        if: steps.baza.outputs.gremo == 'da'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@2.117.0 db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Uveljavi migracije
        if: steps.baza.outputs.gremo == 'da'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@2.117.0 db push --db-url "$SUPABASE_DB_URL" --yes

      # Nove tabele dobijo bralne pravice za agente (agent_bralec), zaprte
      # tabele in stolpci ostanejo zaprti (docs/agenti-baza.md).
      - name: Pravice agentov
        if: steps.baza.outputs.gremo == 'da'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c 'select agent.uskladi_pravice()'

  objavi:
    name: Objava na Vercel
    needs: [preveri, varnost, migracije]
    if: inputs.diagnostika != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Objava iz CI namesto prek Vercelove Git povezave. Ta povezava se je
      # 3. septembra tiho podrla (repozitorij se je preimenoval, Vercel je
      # obdržal staro pot) in dva dni ni nihče opazil, ker se deploy
      # preprosto ni zgodil — nikjer ni bilo rdeče. Objava iz CI je vidna
      # tu, poleg ostalih preverb, in se ne more tiho izgubiti.
      - name: Ali so skrivnosti nastavljene?
        id: skrivnosti
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Manjkajo VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID — objava preskočena."
            echo "::warning::Dodaj jih v Settings -> Secrets and variables -> Actions."
            echo "so=ne" >> "$GITHUB_OUTPUT"
          else
            echo "so=da" >> "$GITHUB_OUTPUT"
          fi

      - name: Namesti Vercel CLI
        if: steps.skrivnosti.outputs.so == 'da'
        # Pripeta razlicica: `@latest` bi ob vsaki objavi potegnil, kar je
        # tisti hip objavljeno — tudi pokvarjeno ali podtaknjeno razlicico.
        run: npm i -g --ignore-scripts vercel@59.25.4

      # Ce objava pade, naj bo takoj jasno KAJ od treh je narobe, ne da je
      # treba ugibati iz "Could not retrieve Project Settings".
      # `vercel whoami` NE sme ustaviti objave. Za ta racun vraca "User not
      # found" tudi za zeton, ki morda dela — verjetno zato, ker je vezan na
      # doloceno ekipo in whoami brez --scope uporabnika ne razresi. Diagnostika
      # naj bo diagnostika; o uspehu odloci `vercel deploy`.
      - name: Preveri dostop (samo diagnostika)
        if: steps.skrivnosti.outputs.so == 'da'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Kdo sem:"
          vercel whoami --token="$VERCEL_TOKEN" || echo "  (whoami ne razresi uporabnika — nadaljujem)"
          echo "ORG_ID se zacne z:     $(printf '%.7s' "$VERCEL_ORG_ID")…"
          echo "PROJECT_ID se zacne z: $(printf '%.7s' "$VERCEL_PROJECT_ID")…"

      # Brez `vercel pull` in `vercel build`: tista dva potrebujeta lokalno
      # povezan projekt (`.vercel/`) in padeta, ce se ORG/PROJECT ID ne
      # ujemata. `vercel deploy` sam naloži izvorno kodo in jo zgradi na
      # Vercelu — manj gibljivih delov, isti izid.
      - name: Objavi v produkcijo
        if: steps.skrivnosti.outputs.so == 'da'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" || {
            echo "::error::Objava ni uspela. Najverjetneje se VERCEL_ORG_ID ali"
            echo "::error::VERCEL_PROJECT_ID ne ujema s projektom (Settings -> General)."
            exit 1
          }

  # Selitev na Hetzner (docs/migracija-hetzner.md, P3): do preklopa DNS gre
  # objava na oba, da je ta, na katerega kaže slff.eu, vedno svež, in je pot
  # nazaj le sprememba DNS. Gradi se tu, ne na strežniku; strežnik dobi le
  # dist/ v svojo mapo, `current` pa se premakne šele, ko je vse preneseno.
  objavi-vm:
    name: Objava na Hetzner VM
    needs: [preveri, varnost, migracije]
    if: inputs.diagnostika != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: objava-vm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Umami website id (stats.slff.eu); empty = no analytics script in the build.
          VITE_UMAMI_ID: ${{ vars.VITE_UMAMI_ID }}
          # "1" = on slff.eu the browser calls the API same-origin (Caddy proxies /rest/v1 etc.).
          # Set the repo variable only after the Caddy block is live; empty = api.slff.eu as before.
          VITE_API_ISTI_IZVOR: ${{ vars.VITE_API_ISTI_IZVOR }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
          npm run build

      - name: Prenos in preklop
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          CILJ=/srv/slff/releases/$GITHUB_SHA
          rsync -a --delete dist/ "deploy@2.31.6.53:$CILJ/"
          # HTML strani igralca, kluba … sme biti predpomnjen (strežnik HTML: brskalnik 5 min,
          # Cloudflare do ure) in kaže na stare /assets/*. Nova izdaja zato dobi še LASTNA
          # sredstva vseh ohranjenih izdaj (assets/.lastna; izdaja brez seznama ima le
          # lastna), ne prenesenih — tako je izdaja največ šestkrat večja, ne raste.
          ssh deploy@2.31.6.53 "cd $CILJ/assets && ls -1 > .lastna && for r in /srv/slff/releases/*/assets; do \
              [ \"\$r\" = $CILJ/assets ] && continue; \
              if [ -f \$r/.lastna ]; then (cd \$r && xargs -r cp -pn -t $CILJ/assets/ < .lastna); else cp -pn \$r/* $CILJ/assets/ 2>/dev/null; fi; \
            done; true"
          # mv -T je atomaren: ni trenutka brez `current`. Obdrži zadnjih 5.
          ssh deploy@2.31.6.53 "ln -sfn $CILJ /srv/slff/current.nov && mv -Tf /srv/slff/current.nov /srv/slff/current \
            && cd /srv/slff/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

  preveri-deploy:
    name: Je nova različica res v zraku?
    needs: [objavi, objavi-vm]
    if: inputs.diagnostika != true && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Zadnja beseda ni "deploy je uspel", ampak "produkcija RES streže ta
      # commit". Build v HTML zapiše `<meta name="slff-commit">`, tu ga samo
      # preberemo. Tišina odslej ne more več izgledati kot uspeh.
      - name: Počakaj na deploy in preveri commit
        run: |
          PRICAKOVAN="${GITHUB_SHA}"
          echo "Pričakujem commit: $PRICAKOVAN"
          for i in $(seq 1 30); do
            NAJDEN=$(curl -sS -m 20 -H 'Cache-Control: no-cache' \
              "https://slff.eu/?ci=$(date +%s)" \
              | grep -o 'name="slff-commit" content="[a-f0-9]*"' \
              | grep -o '[a-f0-9]\{40\}' || true)
            if [ "$NAJDEN" = "$PRICAKOVAN" ]; then
              echo "OK — produkcija streže $NAJDEN"
              exit 0
            fi
            echo "  poskus $i/30: v zraku je ${NAJDEN:-<brez znamke>}"
            sleep 20
          done
          echo
          echo "NAPAKA: po 10 minutah produkcija še vedno ne streže $PRICAKOVAN."
          echo "Najverjetnejši vzroki:"
          echo "  - manjkajo skrivnosti VERCEL_* (glej job 'Objava na Vercel')"
          echo "  - build na Vercelu je padel (glej Deployments)"
          echo "  - projekt je zaustavljen (Settings -> General)"
          exit 1

  # SLFF Scout (scout.slff.eu): isti tok kot objavi-vm, svoja mapa
  # /srv/slff-scout. Teče šele, ko je strežnik pripravljen in lastnik nastavi
  # spremenljivko repozitorija SCOUT_OBJAVA=1 (docs/scout.md, Objava aplikacije).
  objavi-scout:
    name: Objava Scout na Hetzner VM
    needs: [preveri, varnost, migracije]
    if: inputs.diagnostika != true && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SCOUT_OBJAVA == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: objava-scout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
          npm run build:scout

      - name: Prenos in preklop
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          CILJ=/srv/slff-scout/releases/$GITHUB_SHA
          rsync -a --delete dist-scout/ "deploy@2.31.6.53:$CILJ/"
          # mv -T je atomaren; obdrži zadnjih 5 izdaj. Scout je en sveženj brez
          # kosov, zato sredstev starih izdaj ne prenašamo (kot pri slff.eu).
          ssh deploy@2.31.6.53 "ln -sfn $CILJ /srv/slff-scout/current.nov && mv -Tf /srv/slff-scout/current.nov /srv/slff-scout/current \
            && cd /srv/slff-scout/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

      - name: Je nova različica v zraku?
        run: |
          for i in $(seq 1 20); do
            NAJDEN=$(curl -sS -m 20 -H 'Cache-Control: no-cache' "https://scout.slff.eu/?ci=$(date +%s)" \
              | grep -o 'name="slff-commit" content="[a-f0-9]*"' | grep -o '[a-f0-9]\{40\}' || true)
            if [ "$NAJDEN" = "$GITHUB_SHA" ]; then echo "OK — scout.slff.eu streže $NAJDEN"; exit 0; fi
            echo "  poskus $i/20: v zraku je ${NAJDEN:-<brez znamke>}"
            sleep 15
          done
          echo "NAPAKA: scout.slff.eu po 5 minutah ne streže $GITHUB_SHA (Caddy blok, DNS, /srv/slff-scout?)."
          exit 1

