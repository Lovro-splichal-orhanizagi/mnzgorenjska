name: NEVERMERGE Baden R10 refresh metadata observation only
on:
  workflow_dispatch:
    inputs:
      expected_sha: {required: true, type: string}
permissions: {contents: read, actions: read}
jobs:
  refresh:
    if: github.ref == 'refs/heads/codex/baden-r10-refresh-metadata-probe-20261030' && github.run_attempt == 1 && github.actor_id == '25134229' && github.actor == 'nejcar20' && github.triggering_actor == 'nejcar20' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fixed main
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install locked dependencies
        run: echo 'NO_PROVIDER dummy; no npm transport'
      - name: Restore reviewed native seed
        run: echo 'NO_PROVIDER dummy; no production cache restore'
      - name: Prepare private fixed5000 native remainder
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/baden-r10-refresh-metadata-probe.mjs
      - name: Capture fixed Baden native refresh
        run: echo 'NO_PROVIDER dummy; source capture never invoked'
      - name: Verify counted native refresh originals
        run: echo 'NO_PROVIDER dummy; no originals or proof issued'
      - name: Publish exact native refresh cache
        run: echo 'NO_PROVIDER dummy; no source cache published'
      - name: Preserve durable native refresh cache
        run: echo 'NO_PROVIDER dummy; no source cache saved'
      - name: Retain all counted attempts and partial originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baden-r10-metadata-probe-${{ github.run_id }}-1
          path: baden-r10-metadata-probe/
          if-no-files-found: error
          retention-days: 90
