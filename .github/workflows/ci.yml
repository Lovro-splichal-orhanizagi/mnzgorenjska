# DANGER: DISPOSABLE DIAGNOSTIC ONLY. NEVER MERGE. No production credentials.
name: Baden exact installer SQL disposable reproduction - NEVER MERGE
run-name: Exact2d5 installer SQL in isolated PostgreSQL17 only
on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: Exact independently reviewed NEVER MERGE diagnostic SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: baden-install-sql-disposable-probe
  cancel-in-progress: false
jobs:
  disposable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/baden-install-sql-disposable-probe-20261030' && github.run_attempt == 1 && inputs.expected_probe_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: write # Private draft asset visibility; CLI uses fixed own GET only.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
    steps:
      - name: Checkout exact diagnostic SHA - NEVER MERGE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-free generation and mocked container tests - no SQL
        run: node --test scripts/test-baden-install-sql-disposable-probe.mjs
      - name: Exact installer SQL in new networkless disposable containers ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/baden-install-sql-disposable-probe.mjs probe
      - name: Retain bounded disposable diagnostics - never raw SQL or manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baden-install-sql-disposable-${{ github.run_id }}-1
          path: baden-install-sql-disposable-probe/
          if-no-files-found: warn
          retention-days: 30
