# DIAGNOSTIC BRANCH ONLY. NEVER MERGE. Replaces normal CI only on this branch.
name: Baden native outcome read-only reconciliation - never merge
run-name: Fixed failed native40996883123 read-only facts - no retry
on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: Exact independently reviewed diagnostic branch SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: baden-native-readonly-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/baden-native-reconcile-20261030' && github.run_attempt == 1 && inputs.expected_probe_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: write # Required to GET the reviewed asset in the private draft release.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
      MIGRACIJE_PREMOR: ${{ vars.MIGRACIJE_PREMOR }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout exact diagnostic SHA - never main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-free read-only adapter tests
        run: node --test scripts/test-baden-native-readonly-reconcile.mjs
      - name: Authenticate exact failed native, installed owner and reviewed asset before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/baden-native-readonly-reconcile.mjs authenticate
      - name: Owner connection prerequisite
        id: owner
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          command -v psql >/dev/null || { echo "::error::Missing PostgreSQL client; HOLD."; exit 1; }
          if [ "$MIGRACIJE_PREMOR" = "1" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Owner connection missing or migrations paused; HOLD."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in *@127.0.0.1*) echo "tunnel=yes" >> "$GITHUB_OUTPUT";; esac
      - name: Tunnel to owner database
        if: steps.owner.outputs.tunnel == 'yes'
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -L 5432:127.0.0.1:5432 deploy@2.31.6.53
      - name: Fixed read-only reconciliation - never install or retry
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/baden-native-readonly-reconcile.mjs reconcile
      - name: Retain bounded read-only facts and safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baden-native-readonly-${{ github.run_id }}-1
          path: baden-native-readonly-reconcile/
          if-no-files-found: warn
          retention-days: 30
