# DIAGNOSTIC BRANCH ONLY — NEVER MERGE.
name: Baden fixed read-only HTTPS transport diagnostic - never merge
run-name: Fixed failed native41002473384 HTTPS reads - no writer or retry
on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: Exact independently reviewed diagnostic branch SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: baden-native-readonly-https-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/baden-native-https-probe-20261030' && github.run_attempt == 1 && inputs.expected_probe_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: write # Private draft reviewed asset GET visibility only.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Source-free fixed read and redaction tests
        run: node --test scripts/test-baden-native-https-probe.mjs
      - name: Authenticate exact failed native installed owner and M before database keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/baden-native-https-probe.mjs authenticate
      - name: Fixed HTTPS read-only default delay and unpooled controls
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/baden-native-https-probe.mjs probe
      - name: Retain safe observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baden-native-https-${{ github.run_id }}-1
          path: baden-native-https-probe/
          if-no-files-found: warn
          retention-days: 30
