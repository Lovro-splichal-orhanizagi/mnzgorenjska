# NEVER MERGE: dedicated secret-free full-schema scratch SQL validation only.
name: Baden cold source version scratch SQL - never merge
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic head
        required: true
        type: string
permissions: {}
concurrency:
  group: baden-cold-version-scratch-sql
  cancel-in-progress: false
jobs:
  baden_version_sql:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/baden-version-sql-diagnostic-20261030' && github.run_attempt == 1 && inputs.expected_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Source-free boundary and clone tests
        run: node --test scripts/test-baden-cold-source-version.mjs scripts/test-baden-cold-source-version-sql.mjs
      - name: Full fresh migration chain in hosted scratch database
        run: npx --yes supabase@2.117.0 db start
      - name: Observe actual scratch sessions role attributes and schema ownership only
        run: |
          for owner_role in supabase_admin postgres; do
            docker exec -i supabase_db_mnzgorenjska psql -U "$owner_role" -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_user,session_user,current_setting('role') AS selected_role,
            r.rolsuper,r.rolcreaterole,r.rolcreatedb,r.rolbypassrls,r.rolinherit,
            has_schema_privilege(current_user,'private_baden_transition','USAGE') AS transition_usage,
            has_schema_privilege(current_user,'private_baden_transition','CREATE') AS transition_create
            FROM pg_roles r WHERE r.rolname=current_user;
          SELECT nspname,pg_get_userbyid(nspowner) AS actual_schema_owner
            FROM pg_namespace WHERE nspname IN('private_baden_transition','private_baden_history','private_fussball');
          SELECT rolname,rolsuper,rolcreaterole,rolcreatedb,rolbypassrls,rolinherit
            FROM pg_roles WHERE rolname IN('postgres','supabase_admin','authenticator','service_role');
          SQL
          done
