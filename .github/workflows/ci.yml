# NEVER MERGE: isolated ephemeral hosted SQL validation only; no production credentials.
name: G9 native800 targeted fresh SQL validation - never merge
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  varnost:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/g9-native800-targeted-sql-20261030' && github.run_attempt == 1 && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Fresh full migration chain in ephemeral hosted DB
        run: npx --yes supabase@2.117.0 db start
      - name: Actual G9 preparation and import bridge rollback fixtures
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          FCF_G9_NATIVE800_PREPARE_CI_SQL_TEST: '1'
          FCF_G9_NATIVE800_BRIDGE_CI_SQL_TEST: '1'
          FCF_G9_NATIVE800_LAUNCH_CI_SQL_TEST: '1'
        run: node --test scripts/test-fcf-g1-remainder-g9-native800-prepare-sql.mjs scripts/test-fcf-g9-native800-bridge-sql.mjs scripts/test-fcf-g9-native800-launch-sql.mjs
      - name: Remove ephemeral hosted DB
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
