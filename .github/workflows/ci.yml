name: NEVERMERGE exact a0 to 100 scratch migration upgrade
on:
  workflow_dispatch:
    inputs:
      expected_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  varnost:
    if: github.ref == 'refs/heads/codex/g1-out-of-order-upgrade-probe-20261030' && github.run_attempt == 1 && github.actor_id == '25134229' && github.actor == 'nejcar20' && github.triggering_actor == 'nejcar20' && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Record fixed observation identity and reject external database settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,datetime
          forbidden=['SUPABASE_DB_URL','SUPABASE_SERVICE_ROLE_KEY','DATABASE_URL','DB_URL','PGHOST','PGPASSWORD','SUPABASE_ACCESS_TOKEN']
          assert not any(os.environ.get(k) for k in forbidden), 'external database settings forbidden'
          assert os.environ['GITHUB_SHA']==os.environ['EXPECTED_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='Lovro-splichal-orhanizagi/mnzgorenjska'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1' and os.environ['GITHUB_JOB']=='varnost'
          p=pathlib.Path('upgrade-evidence');p.mkdir()
          data={k:os.environ[k] for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF','GITHUB_ACTOR','GITHUB_ACTOR_ID','GITHUB_REPOSITORY','GITHUB_JOB']}
          data.update(kind='SCRATCH_UPGRADE_OBSERVATION_ONLY',baseline='a0b8eb102db3919b2f15acebd3efe1c9775b500b',target='1008971f80e43f4be165a674bcc902af0477075d',createdAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),productionDatabase=False,providerOperation=False,sourceAuthority=False)
          (p/'identity.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Checkout immutable a0 baseline schema
        uses: actions/checkout@v4
        with:
          ref: a0b8eb102db3919b2f15acebd3efe1c9775b500b
          path: schema-a0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fresh scratch a0 full migration chain through 1900
        working-directory: schema-a0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a0b8eb102db3919b2f15acebd3efe1c9775b500b
          test -f supabase/migrations/20261030190000_anketa_placila_50.sql
          npx --yes supabase@2.117.0 db start > "$GITHUB_WORKSPACE/upgrade-evidence/a0-db-start.log" 2>&1
          docker exec supabase_db_mnzgorenjska psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 -c 'select version from supabase_migrations.schema_migrations order by version' > "$GITHUB_WORKSPACE/upgrade-evidence/a0-applied-versions.txt"
          python3 - <<'PY'
          import pathlib
          expected=sorted(x.name.split('_')[0] for x in pathlib.Path('supabase/migrations').glob('*.sql'))
          actual=(pathlib.Path('../upgrade-evidence/a0-applied-versions.txt')).read_text().splitlines()
          assert actual==expected, 'scratch a0 migration receipt inventory differs'
          assert actual[-1]=='20261030190000'
          PY
      - name: Checkout immutable 100 target schema and G1 tests
        uses: actions/checkout@v4
        with:
          ref: 1008971f80e43f4be165a674bcc902af0477075d
          path: schema-100
          persist-credentials: false
      - name: Authenticate exact three pending earlier versions
        working-directory: schema-100
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1008971f80e43f4be165a674bcc902af0477075d
          python3 - <<'PY'
          import pathlib,json,hashlib
          baseline=pathlib.Path('../schema-a0/supabase/migrations');target=pathlib.Path('supabase/migrations')
          a={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in baseline.glob('*.sql')}
          b={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in target.glob('*.sql')}
          expected=['20261030143100_sanmarino_fsgc.sql','20261030144100_tajska_t1.sql','20261030160000_fcf_g1_native800.sql']
          assert sorted(set(b)-set(a))==expected
          assert all(b.get(k)==v for k,v in a.items()), 'applied migration removed or edited'
          assert all(x[:14]<'20261030190000' for x in expected)
          pathlib.Path('../upgrade-evidence/migration-byte-manifests.json').write_text(json.dumps({'baseline':a,'target':b,'onlyMissing':expected},indent=2)+'\n')
          PY
      - name: Default dry-run must refuse these exact earlier migrations
        working-directory: schema-100
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes supabase@2.117.0 db push --local --dry-run > "$GITHUB_WORKSPACE/upgrade-evidence/default-dry-run.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$GITHUB_WORKSPACE/upgrade-evidence/default-dry-run.exit"
          test "$rc" -ne 0
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('../upgrade-evidence/default-dry-run.log').read_text()
          assert 'Found local migration files to be inserted before the last migration on remote database' in s
          assert '--include-all' in s
          assert sorted(set(re.findall(r'\b[0-9]{14}_[a-z0-9_]+\.sql\b',s)))==['20261030143100_sanmarino_fsgc.sql','20261030144100_tajska_t1.sql','20261030160000_fcf_g1_native800.sql']
          PY
      - name: Include-all dry-run must select exactly three missing migrations
        working-directory: schema-100
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 db push --local --include-all --dry-run > "$GITHUB_WORKSPACE/upgrade-evidence/include-all-dry-run.log" 2>&1
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('../upgrade-evidence/include-all-dry-run.log').read_text()
          assert sorted(set(re.findall(r'\b[0-9]{14}_[a-z0-9_]+\.sql\b',s)))==['20261030143100_sanmarino_fsgc.sql','20261030144100_tajska_t1.sql','20261030160000_fcf_g1_native800.sql']
          PY
      - name: Apply exactly these three only to scratch and verify complete receipt inventory
        working-directory: schema-100
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 db push --local --include-all --yes > "$GITHUB_WORKSPACE/upgrade-evidence/include-all-apply.log" 2>&1
          docker exec supabase_db_mnzgorenjska psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 -c 'select version from supabase_migrations.schema_migrations order by version' > "$GITHUB_WORKSPACE/upgrade-evidence/100-applied-versions.txt"
          python3 - <<'PY'
          import pathlib,re
          expected=sorted(p.name.split('_')[0] for p in pathlib.Path('supabase/migrations').glob('*.sql'))
          actual=pathlib.Path('../upgrade-evidence/100-applied-versions.txt').read_text().splitlines()
          assert actual==expected
          s=pathlib.Path('../upgrade-evidence/include-all-apply.log').read_text()
          applied=re.findall(r'Applying migration ([0-9]{14}_[a-z0-9_]+\.sql)',s)
          assert applied==['20261030143100_sanmarino_fsgc.sql','20261030144100_tajska_t1.sql','20261030160000_fcf_g1_native800.sql']
          PY
      - name: Install exact100 locked dependencies without lifecycle scripts
        working-directory: schema-100
        run: npm ci --ignore-scripts > "$GITHUB_WORKSPACE/upgrade-evidence/npm-ci.log" 2>&1
      - name: Actual unchanged G1 rollback roles conservation and concurrent-writer suite on upgraded scratch
        working-directory: schema-100
        env:
          SUPABASE_DB_CONTAINER: supabase_db_mnzgorenjska
          SUPABASE_TEST_DB: postgres
          FCF_G1_NATIVE800_CI_SQL_TEST: '1'
          FCF_G1_NATIVE800_DISPOSABLE_DB: '1'
        run: node --test --test-concurrency=1 scripts/test-fcf-g1-native800-sql.mjs > "$GITHUB_WORKSPACE/upgrade-evidence/g1-native800-sql.tap" 2>&1
      - name: Stop scratch database without backup
        if: always()
        working-directory: schema-a0
        run: npx --yes supabase@2.117.0 stop --no-backup > "$GITHUB_WORKSPACE/upgrade-evidence/stop.log" 2>&1
      - name: Retain all scratch upgrade evidence and byte hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,datetime
          p=pathlib.Path('upgrade-evidence');p.mkdir(exist_ok=True)
          rows={x.name:{'bytes':x.stat().st_size,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in sorted(p.iterdir()) if x.is_file()}
          (p/'SHA256.json').write_text(json.dumps({'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':rows},indent=2)+'\n')
          PY
      - name: Upload scratch evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-a0-to-100-upgrade-${{ github.run_id }}-1
          path: upgrade-evidence/
          if-no-files-found: error
          retention-days: 90
