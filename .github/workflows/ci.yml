# DIAGNOSTIC BRANCH ONLY — NEVER MERGE. No source collection/native writes.
name: G9 native800 read-only projection and ledger preflight - never merge
run-name: Fixed G9 read-only SQL and actual800 accounting costs
on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: Exact independently reviewed NEVER MERGE diagnostic head
        required: true
        type: string
      expected_main_sha:
        description: Exact separately deployed production main (no epoch alias)
        required: true
        type: string
      main_ci_run_id:
        description: Actual successful first-attempt production push CI
        required: true
        type: string
permissions: {}
concurrency:
  group: g9-native800-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/g9-native800-readonly-preflight-20261030' && github.run_attempt == 1 && inputs.expected_probe_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: write # Required only for GET visibility of retained private draft evidence.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id }}
    steps:
      - name: Checkout exact reviewed diagnostic SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Source-free read-only boundary tests
        run: node --test scripts/test-fcf-g9-readonly-github.mjs scripts/test-fcf-g9-native800-readonly-preflight.mjs scripts/test-fcf-g1-remainder-native800-runtime-tree.mjs
      - name: Observe rate budget then authenticate root runtime main CI and served before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fcf-g9-native800-readonly-preflight.mjs authenticate
      - name: Observe actual full800 ledger once without database authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fcf-g9-native800-readonly-preflight.mjs ledger
      - name: Owner read-only connection prerequisite
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRACIJE_PREMOR: ${{ vars.MIGRACIJE_PREMOR }}
        run: |
          command -v psql >/dev/null || exit 1
          [ "$MIGRACIJE_PREMOR" != '1' ] && [ -n "$SUPABASE_DB_URL" ] || exit 1
          case "$SUPABASE_DB_URL" in *@127.0.0.1:5432/*) ;; *) exit 1;; esac
      - name: Tunnel for fixed read-only G9 projection
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KLJUC" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -L 5432:127.0.0.1:5432 deploy@2.31.6.53
      - name: Read fixed G9 preparation twice then observe GH-only state again
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
          PGAPPNAME: slff-g9-native800-readonly-preflight
        run: node scripts/fcf-g9-native800-readonly-preflight.mjs read
      - name: Retain bounded read-only facts safe timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-native800-readonly-preflight-${{ github.run_id }}-1
          path: g9-native800-readonly-preflight/
          if-no-files-found: warn
          retention-days: 30
