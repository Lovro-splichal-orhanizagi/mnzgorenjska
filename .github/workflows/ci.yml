      - run: exit 99
  refresh800-capture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/fcf-refresh800-metadata-probe-20261030' && github.run_attempt == 1 && inputs.expected_sha == github.sha && github.actor == 'nejcar20' && github.actor_id == '25134229' && github.triggering_actor == 'nejcar20'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without scripts
        run: node --version
      - name: Verify refresh800 source-free
        run: node --check scripts/fcf-refresh800-metadata-probe-NEVERMERGE.mjs
      - name: Reserve actual refresh800 execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fcf-refresh800-metadata-probe-NEVERMERGE.mjs reserve
      - name: Retain refresh800 reservation
        run: test -d fcf-metadata-probe
      - name: Wait for reviewed refresh800 protected claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fcf-refresh800-metadata-probe-NEVERMERGE.mjs wait
      - name: Capture fixed240 refresh800 originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fcf-refresh800-metadata-probe-NEVERMERGE.mjs capture
      - name: Retain refresh800 originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcf-metadata-probe-${{ github.run_id }}
          path: fcf-metadata-probe/
          if-no-files-found: error
