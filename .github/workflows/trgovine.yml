name: Trgovine (stanje in namestitve)

# Stanje iOS različice in namestitve po dnevih v bazo (admin: Rast), mejniki
# namestitev na Discord (scripts/trgovine.mjs).
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

concurrency:
  group: trgovine

permissions:
  contents: read

jobs:
  trgovine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/trgovine.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_VENDOR: ${{ vars.ASC_VENDOR }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          PLAY_BUCKET: ${{ vars.PLAY_BUCKET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
