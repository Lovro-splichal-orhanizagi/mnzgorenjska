name: Diagnostika dveh javnih zapisnikov

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      vir:
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  dokument:
    if: inputs.vir != 'dfb-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        vir: ${{ fromJSON(inputs.vir == 'novanet' && '["novanet"]' || inputs.vir == 'fussball' && '["fussball"]' || '["novanet","fussball"]') }}
    concurrency:
      group: live-source-${{ matrix.vir }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      VIR: ${{ matrix.vir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # One observed public document and its explicitly declared fonts. No database/secrets,
      # arbitrary URLs, batch crawling or retry after an empty/refused response.
      - name: En javni dokument z varnimi metapodatki
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          import {ustvariAnonimniPrenos} from './scripts/viri/novanet-transport.mjs'
          import {jeIzziv} from './scripts/viri/fussball.mjs'
          const source=process.env.VIR
          const urls={
            novanet:'https://www.futgal.es/pnfg/NPcd/NFG_CmpPartido?cod_primaria=1000120&CodActa=1306467&cod_acta=1306467',
            fussball:'https://www.fussball.de/ajax.match.lineup/-/mode/PAGE/spiel/02TMCK1048000000VS5489BTVT4H6CF2/ticker-id/selectedTickerId'
          }
          const url=urls[source]
          if(!url)throw Error('Unknown fixed diagnostic case')
          const folder=`audit/document-${source}`;mkdirSync(folder,{recursive:true})
          const requests=[]
          const safeUrl=value=>{const u=new URL(value,url);return u.origin+u.pathname.split(';')[0]}
          const save=()=>writeFileSync(`${folder}/requests.json`,JSON.stringify(requests,null,2)+'\n')
          const transport=ustvariAnonimniPrenos({jeIzziv,najvecBajtov:2_000_000,maxPreusmeritev:3,fetchFn:async(u,options)=>{
            if(new URL(u).origin!==new URL(url).origin)throw Error('Unexpected diagnostic origin')
            const r=await fetch(u,options),headers={}
            for(const key of ['content-type','content-length','content-encoding','transfer-encoding','date','retry-after'])headers[key]=r.headers.get(key)
            if(r.headers.get('location'))headers.location=safeUrl(r.headers.get('location'))
            requests.push({at:new Date().toISOString(),url:safeUrl(u),status:r.status,headers});save()
            return r
          }})
          let bytes=null,result={source,url}
          try{
            const r=await transport(url,{headers:{'User-Agent':'SLFF fantasy (slff.eu; splih.94@gmail.com)'},signal:AbortSignal.timeout(60000)})
            if(!r.ok){try{await r.body?.cancel()}catch{};throw Object.assign(Error(`HTTP ${r.status}`),{status:r.status})}
            bytes=new Uint8Array(await r.arrayBuffer());result.status=r.status;result.contentType=r.headers.get('content-type')
          }catch(e){
            result.error=e.message;result.status=e.status??null;result.refusal=!!e.zavrnitev
            if(e.dokument?.bytes instanceof Uint8Array)bytes=e.dokument.bytes
            process.exitCode=1
          }
          if(bytes){writeFileSync(`${folder}/document.bin`,bytes);result.bytes=bytes.length;result.sha256=createHash('sha256').update(bytes).digest('hex')}
          const assets=[]
          const asset=async(file,address)=>{
            await new Promise(resolve=>setTimeout(resolve,5000))
            const r=await transport(address,{headers:{'User-Agent':'SLFF fantasy (slff.eu; splih.94@gmail.com)'},signal:AbortSignal.timeout(60000)})
            if(!r.ok){try{await r.body?.cancel()}catch{};throw Object.assign(Error(`HTTP ${r.status}`),{status:r.status})}
            const data=new Uint8Array(await r.arrayBuffer()),sha256=createHash('sha256').update(data).digest('hex')
            writeFileSync(`${folder}/${file}`,data);assets.push({file,url:address,sha256,bytes:data.length})
            return data
          }
          if(source==='fussball'&&bytes&&!result.error)try{
            const html=new TextDecoder().decode(bytes),ids=[...new Set([...html.matchAll(/data-obfuscation="([a-z0-9]{8})"/g)].map(m=>m[1]))]
            if(!ids.length||ids.length>4)throw Error('Unexpected number of published lineup fonts')
            for(const id of ids){
              const css=await asset(`${id}.css`,`https://www.fussball.de/export.fontface/-/id/${id}/type/css`)
              const links=[...new TextDecoder().decode(css).matchAll(/url\(\s*['"]?([^'"()\s]+)['"]?\s*\)\s*format\(\s*['"]woff['"]\s*\)/g)]
              if(links.length!==1)throw Error('Expected one explicitly published WOFF font')
              const address=new URL(links[0][1],`https://www.fussball.de/export.fontface/-/id/${id}/type/css`)
              if(address.origin!=='https://www.fussball.de'||address.pathname!==`/export.fontface/-/format/woff/id/${id}/type/font`)throw Error('Unexpected font origin or identity')
              await asset(`${id}.woff`,address.href)
            }
          }catch(e){result.assetError=e.message;process.exitCode=1}
          result.assets=assets
          save();writeFileSync(`${folder}/result.json`,JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.vir }}
          path: audit/document-${{ matrix.vir }}/
          retention-days: 14

  dfb-capture:
    if: inputs.vir == 'dfb-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38970734064
          name: vir-dfb-2026
          path: audit/failed-current
      - name: Inspect three already-captured public reports (no source requests or database)
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          import {gzipSync} from 'node:zlib'
          import {vZapisnik,varniFetch,jeIzziv} from './scripts/viri/dfb.mjs'
          const root='audit/failed-current',requests=JSON.parse(readFileSync(`${root}/prenosi.json`,'utf8'))
          const plain=s=>s.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()
          for(const id of ['2426097','2426099','2426100']){
            const hits=requests.filter(r=>r.url.endsWith(`-${id}`))
            if(hits.length!==1)throw Error(`Expected one captured report ${id}`)
            const r=hits[0]
            if(!/^[a-f0-9]{64}\.html$/.test(r.file))throw Error('Invalid captured filename')
            const data=readFileSync(`${root}/${r.file}`),sha=createHash('sha256').update(data).digest('hex')
            if(sha!==r.sha256)throw Error('Capture SHA mismatch')
            const html=data.toString('utf8')
            let result
            try{const z=vZapisnik(html,{id});result={accepted:true,home:z.domaci.postava.length,away:z.gostje.postava.length}}catch(e){result={accepted:false,error:e.message}}
            console.log(JSON.stringify({id,url:r.url,at:r.at,sha256:sha,bytes:data.length,result,lineupTables:(html.match(/class="[^"]*m-MatchDetails-lineup-table[^"]*"/g)||[]).length,tables:[...html.matchAll(/<table\b[^>]*>[\s\S]*?<\/table>/gi)].map(m=>({tag:m[0].match(/^<table[^>]*>/)[0],rows:(m[0].match(/<tr\b/g)||[]).length,text:plain(m[0]).slice(0,3000)}))},null,2))
            console.log('DFB_CAPTURE:'+JSON.stringify({id,sha256:sha,gzipBase64:gzipSync(data).toString('base64')}))
          }
          mkdirSync('audit/fresh-three',{recursive:true})
          const fresh=[]
          for(const id of ['2426097','2426099','2426100']){
            const url=requests.find(r=>r.url.endsWith(`-${id}`)).url
            await new Promise(r=>setTimeout(r,3000))
            const response=await varniFetch(url,{headers:{'User-Agent':'SLFF fantasy (slff.eu; splih.94@gmail.com)'}})
            if(!response.ok)throw Error(`HTTP ${response.status}: ${url}`)
            const data=Buffer.from(await response.arrayBuffer()),sha256=createHash('sha256').update(data).digest('hex'),html=data.toString('utf8')
            if(!html.trim()||jeIzziv(html))throw Error('Empty or challenged public document; stopping')
            writeFileSync(`audit/fresh-three/${id}.html`,data)
            let result
            try{const z=vZapisnik(html,{id});result={accepted:true,home:z.domaci.postava.length,away:z.gostje.postava.length,goals:z.goli.length}}catch(e){result={accepted:false,error:e.message}}
            fresh.push({id,url,at:new Date().toISOString(),sha256,bytes:data.length,result,tables:(html.match(/<table\b/g)||[]).length,histories:(html.match(/m-MatchDetails-history/g)||[]).length})
            console.log('DFB_FRESH_CAPTURE:'+JSON.stringify({id,sha256,gzipBase64:gzipSync(data).toString('base64')}))
          }
          writeFileSync('audit/fresh-three/summary.json',JSON.stringify(fresh,null,2));console.log(JSON.stringify({fresh},null,2))
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfb-fresh-three-${{ github.run_id }}
          path: audit/fresh-three/
          retention-days: 14
