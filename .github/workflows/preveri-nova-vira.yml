name: FCF prepare rollback diagnostic
run-name: FCF prepare rollback diagnostic ${{ inputs.expected_diagnostic_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact deployed main SHA; must remain unchanged
        type: string
        required: true
        default: d25c9b0bac906e2b9f7ad13e749a724e7b6fac77
      expected_diagnostic_sha:
        description: Exact reviewed diagnostic branch commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  prepare-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_DIAGNOSTIC_SHA: ${{ inputs.expected_diagnostic_sha }}
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch and live main pins before tunnel
        run: node scripts/diagnose-fcf-prepare-rollback.mjs --identity
      - name: Existing deploy tunnel for bounded rollback diagnostic
        env:
          KLJUC: ${{ secrets.DEPLOY_SSH_KEY }}
          ZNANI: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          diag_ssh_dir="$RUNNER_TEMP/fcf-prepare-diagnostic-ssh"
          install -m 700 -d "$diag_ssh_dir"
          trap 'rm -rf "$diag_ssh_dir"' EXIT
          printf '%s\n' "$KLJUC" > "$diag_ssh_dir/id_ed25519"
          chmod 600 "$diag_ssh_dir/id_ed25519"
          printf '%s\n' "$ZNANI" > "$diag_ssh_dir/known_hosts"
          if ! ssh -fN -i "$diag_ssh_dir/id_ed25519" \
            -o UserKnownHostsFile="$diag_ssh_dir/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=1 \
            -L 5432:127.0.0.1:5432 deploy@2.31.6.53 2>/dev/null; then
            echo 'FCF prepare diagnostic: tunnel setup failed.'
            exit 1
          fi
      - name: Fixed prepare call with unconditional rollback
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/diagnose-fcf-prepare-rollback.mjs --probe
      - name: Retain sanitized rollback diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcf-prepare-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: fcf-prepare-rollback/result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
