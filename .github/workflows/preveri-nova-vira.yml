name: FCF endpoint read-only diagnostic
run-name: FCF endpoint read-only diagnostic ${{ inputs.expected_diagnostic_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact deployed main SHA; must remain unchanged
        type: string
        required: true
        default: d25c9b0bac906e2b9f7ad13e749a724e7b6fac77
      expected_diagnostic_sha:
        description: Exact reviewed diagnostic branch commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  endpoint-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SHA pins and GET configured endpoint only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_DIAGNOSTIC_SHA: ${{ inputs.expected_diagnostic_sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_URL_CONFIGURED: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: node scripts/diagnose-fcf-endpoint-readonly.mjs
      - name: Retain sanitized diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcf-endpoint-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: fcf-endpoint-readonly/result.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
