name: Tedensko porocilo

# Dnevna "Preverba podatkov" se oglasi SAMO ob tezavi. To je prav za alarm, a
# pomeni, da tisina lahko pomeni oboje: da je vse v redu ali da je nekaj
# nehalo teci. Teden dni tisine je zato brez pomena.
#
# To porocilo pride vsak teden, tudi kadar je vse v redu, in pove stevilke.
# Ce ga kak teden ni, je to podatek.
#
# Ponedeljek ob 8:00 po slovenskem casu (6:00 UTC poleti, 7:00 pozimi —
# cron je v UTC, ura poletnega casa nas tu ne moti).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  porocilo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      - name: Tedensko porocilo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_TEDENSKO: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/tedensko-porocilo.mjs --discord

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Tedensko porocilo"
