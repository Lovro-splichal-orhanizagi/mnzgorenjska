name: Uvoz odobrene DFB regije
run-name: Uvoz odobrene DFB regije ${{ inputs.liga }}
on:
  workflow_dispatch:
    inputs:
      liga:
        description: Neaktivna regionalna liga
        type: choice
        required: true
        options: [de-regionalliga-nord, de-regionalliga-west, de-regionalliga-suedwest, de-regionalliga-bayern]
      source_commit:
        description: Pregledani celotni SHA obeh zajemov ali ponovitev
        type: string
        required: true
      archive_run:
        description: Uspešen arhivski audit ali preverjena ponovitev
        type: string
        required: true
      current_run:
        description: Uspešen tekoči audit ali ponovitev (izvirni zajem največ 12 ur)
        type: string
        required: true
      approved_sha256:
        description: Pregledani SHA manifesta
        type: string
        required: true

      repair_current_players:
        description: Samo pregledani popravek29 neaktivnih trenutnih igralcev, brez ponovnega uvoza/vklopa
        type: boolean
        default: false
      repair_plan_sha256:
        description: Izrecni pregledani SHA zaklenjenega načrta29 igralcev
        type: string
        required: false

permissions:
  contents: read
  actions: read
concurrency:
  group: uvoz-lige-${{ inputs.liga }}
  cancel-in-progress: false
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LIGA: ${{ inputs.liga }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIVE_RUN: ${{ inputs.archive_run }}
      CURRENT_RUN: ${{ inputs.current_run }}
      APPROVED_SHA: ${{ inputs.approved_sha256 }}
      REPAIR_CURRENT: ${{ inputs.repair_current_players }}
      REPAIR_PLAN_SHA: ${{ inputs.repair_plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preveri dejanska sezonska posla in pregledani razčlenjevalnik
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "$REPAIR_CURRENT" = true ]; then
            if [ "$LIGA" != de-regionalliga-suedwest ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then exit 1; fi
          elif [ -n "$REPAIR_PLAN_SHA" ]; then exit 1; fi
          node scripts/preveri-zagona-dfb-regije.mjs "$LIGA" "$SOURCE_COMMIT" "$ARCHIVE_RUN" "$CURRENT_RUN" release/jobs.json audit/archive audit/current
      - name: Ponovi vse izvorne bajte brez omrežja
        run: |
          set -euo pipefail
          node scripts/vklopi-dfb-regijo.mjs prepare "$LIGA" audit/archive audit/current "$SOURCE_COMMIT" release/jobs.json release/manifest.json | tee release/summary.json
      - name: Preveri zaklenjeni načrt29 in nespremenjenih612 izvornih dejstev — brez poverilnic
        if: inputs.repair_current_players
        run: |
          set -euo pipefail
          node scripts/reconcile-dfb-current-players.mjs verify release/manifest.json "$APPROVED_SHA" "$REPAIR_PLAN_SHA" | tee release/repair-proof.json
      - name: Počakaj na starejše uvoze
        if: inputs.approved_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cakaj-na-uvoze.mjs --liga "$LIGA"
      - name: Odobren bootstrap in uvoz samo iz zaprtih zajemov — brez vklopa
        if: ${{ !inputs.repair_current_players }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/uvozi-dfb-regijo.mjs release/manifest.json "$APPROVED_SHA" audit/archive audit/current release/jobs.json | tee release/import.txt
      - name: Atomski aktivni popravek29 in celotna nespremenjena native preverba — brez vklopa
        if: inputs.repair_current_players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/reconcile-dfb-current-players.mjs apply release/manifest.json "$APPROVED_SHA" "$REPAIR_PLAN_SHA" | tee release/reconciliation.json
      - name: Pregledni manifest in rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfb-regional-import-${{ github.run_id }}
          path: release/
          if-no-files-found: ignore
          retention-days: 90
