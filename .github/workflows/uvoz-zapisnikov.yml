name: Uvoz zapisnikov

# Zapisniki se objavijo nekaj ur do nekaj dni po tekmi. Ker se tekme igrajo
# predvsem ob petkih, sobotah in nedeljah, na te dneve pobiramo VSAKO URO
# (tekme končane 17-19h → zapisnik tipično 20-22h, včasih zjutraj). Med
# tednom enkrat dnevno je dovolj.
#
# Uvoz je idempotenten: tekma z istim zapisnikom se posodobi, ne podvoji.
#
# **Seznam lig pove baza, ne ta datoteka.** Doslej sta bili člani in mladinci
# napisani kot dva bloka korakov. Ob tretji ligi bi to pomenilo, da se nova
# liga tiho ne uvaža — stran bi jo pokazala, točke pa se ne bi nikoli
# osvežile in nič ne bi javilo napake. Zato korak najprej vpraša
# `aktivna-tekmovanja.mjs`, katera tekmovanja so vklopljena.
#
# Vsaka liga ima svoje kroge, tekme, igralce in fantasy ekipe; ista oseba je
# pri članih in mladincih dve vrstici (`players.competition_id`), zato
# statistika med ligami ne uhaja. Klubi so si skupni, vir pa ne — naslove in
# vzdevke klubov da `competitions.source` prek `scripts/viri/`.
on:
  schedule:
    # Minuta 17, ne 0: GitHub ob polni uri, ko se sprožijo vsi croni sveta,
    # zagone zamika ali izpusti. Z '0 * …' je "urni" uvoz 3.–4. 10. 2026
    # dejansko tekel na 3–6 ur in točke so ob vikendu zaostajale.
    # Petek (5), Sobota (6), Nedelja (0) — vsako uro
    - cron: '17 * * * 5,6,0'
    # Ponedeljek do četrtek — enkrat, ob 5:17 UTC (7:17 po naše)
    - cron: '17 5 * * 1-4'
    # Rezerva: GitHub zagon ob obremenitvi tiho izpusti (13. 10. 2026 ga ni
    # bilo). Posel `zacni` jo preskoči le, če je današnji zagon uspel ali še
    # teče; padel ali preklican jutranji zagon rezerva ponovi (19. 10. 2026
    # je jutranji padel, rezerva pa se je preskočila in cel dan ni bilo uvoza).
    - cron: '47 6 * * 1-4'
  workflow_dispatch:

permissions:
  contents: read

# Vsak delovni tok iz druzine uvozov ima svojo skupino. Skupna `uvoz` je
# pomenila, da je vsak nov cron izpodrinil rocni zagon, ki je cakal v vrsti
# (GitHub v skupini hrani le EN cakajoci zagon, starejsega preklice). Tu je
# izpodrivanje v redu — naslednji cron naredi isto delo.
#
# Kateri pari ne smejo teci hkrati (vsi pisejo v iste tabele):
#   - uvoz-zapisnikov / uvoz-lige: klubi, igralci, krogi, tekme, nastopi —
#     dva uvoza iste lige bi ustvarila dvojnike igralcev in klubov;
#   - zdruzi-klube z vsemi uvozi: uvoz si ob zagonu zapomni id-je klubov in
#     ce mu enega medtem izbrisemo, tekme obvisijo;
#   - tedensko-cene / uvoz-lige (cene): oba pisesta cene istih igralcev.
# Grbi (grbi-nzs) pisejo le `teams.logo_url` in tecejo loceno.
# Zaporedje zagotovi korak "Pocakaj na starejse uvoze": vsak zagon pocaka
# na tiste iz druzine, ki so se zaceli pred njim.
concurrency:
  group: uvoz-zapisnikov
  cancel-in-progress: false

jobs:
  # Rezervni cron (06:47) teče le, če danes ni bilo zagona, ki je uspel ali še
  # čaka/teče (status != completed ali conclusion == success).
  zacni:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      teci: ${{ steps.odlocitev.outputs.teci }}
    steps:
      - id: odlocitev
        env:
          GH_TOKEN: ${{ github.token }}
          URNIK: ${{ github.event.schedule }}
        run: |
          teci=true
          if [ "$URNIK" = '47 6 * * 1-4' ]; then
            danes=$(date -u +%Y-%m-%dT04:00:00Z)
            prej=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uvoz-zapisnikov.yml --limit 20 \
              --json databaseId,createdAt,status,conclusion \
              --jq "[.[]|select(.databaseId != ${GITHUB_RUN_ID} and .createdAt >= \"$danes\" and (.status != \"completed\" or .conclusion == \"success\"))]|length")
            [ "$prej" -gt 0 ] && teci=false
          fi
          echo "Rezervni zagon potreben: $teci"
          echo "teci=$teci" >> "$GITHUB_OUTPUT"

  # Vsaka država v svojem poslu, velike razdeljene na koše (scripts/nocni-kosi.mjs).
  # Viri so različna spletišča (vsako s svojim tempom), klubi so enolični po
  # državi, igralci po ligi — posla različnih držav se ne dotakneta istih
  # vrstic. Koši iste države si delijo klube: hkraten vpis istega novega kluba
  # ujame `klubId` (23505 → obstoječi), zaklep vrstice ("lock timeout") pa
  # drugi poskus lige na koncu koša.
  #
  # Zakaj koši: Avstrija (162 vklopljenih lig) je 11.–12. 10. 2026 v enem
  # poslu v 240 minutah obdelala 42 lig in GitHub jo je preklical, vsak zagon
  # iste. Preklican ali padel posel predpomnilnika ni shranil, zato je
  # naslednji spet bral in uvažal vse zapisnike zadnjih 21 dni.
  uvoz:
    needs: zacni
    if: needs.zacni.outputs.teci == 'true'
    strategy:
      fail-fast: false
      # Leave hosted runner capacity for release validation and deployment jobs.
      max-parallel: 16
      matrix:
        # Nova država mora na ta seznam, sicer se njene lige ponoči ne uvažajo.
        # Število košev je isto kot KOSOV v scripts/nocni-kosi.mjs (smoke primerja).
        # Koliko košev sme brati isti vir, določa VZPOREDNI tam.
        include:
          - { drzava: SI, kos: 1, kosov: 2 }
          - { drzava: SI, kos: 2, kosov: 2 }
          - { drzava: HR, kos: 1, kosov: 3 }
          - { drzava: HR, kos: 2, kosov: 3 }
          - { drzava: HR, kos: 3, kosov: 3 }
          - { drzava: SK, kos: 1, kosov: 2 }
          - { drzava: SK, kos: 2, kosov: 2 }
          - { drzava: HU, kos: 1, kosov: 3 }
          - { drzava: HU, kos: 2, kosov: 3 }
          - { drzava: HU, kos: 3, kosov: 3 }
          - { drzava: CZ, kos: 1, kosov: 1 }
          - { drzava: AT, kos: 1, kosov: 4 }
          - { drzava: AT, kos: 2, kosov: 4 }
          - { drzava: AT, kos: 3, kosov: 4 }
          - { drzava: AT, kos: 4, kosov: 4 }
          - { drzava: RS, kos: 1, kosov: 2 }
          - { drzava: RS, kos: 2, kosov: 2 }
          - { drzava: RO, kos: 1, kosov: 1 }
          - { drzava: EE, kos: 1, kosov: 1 }
          - { drzava: PL, kos: 1, kosov: 1 }
          - { drzava: ES, kos: 1, kosov: 1 }
          - { drzava: DE, kos: 1, kosov: 1 }
          - { drzava: LV, kos: 1, kosov: 1 }
          - { drzava: MK, kos: 1, kosov: 1 }
          - { drzava: GR, kos: 1, kosov: 6 }
          - { drzava: GR, kos: 2, kosov: 6 }
          - { drzava: GR, kos: 3, kosov: 6 }
          - { drzava: GR, kos: 4, kosov: 6 }
          - { drzava: GR, kos: 5, kosov: 6 }
          - { drzava: GR, kos: 6, kosov: 6 }
          - { drzava: TR, kos: 1, kosov: 1 }
          - { drzava: UA, kos: 1, kosov: 1 }
          - { drzava: AM, kos: 1, kosov: 1 }
          - { drzava: AZ, kos: 1, kosov: 1 }
          - { drzava: DK, kos: 1, kosov: 1 }
          - { drzava: GB, kos: 1, kosov: 1 }
          - { drzava: MT, kos: 1, kosov: 1 }
          - { drzava: ME, kos: 1, kosov: 1 }
          - { drzava: BA, kos: 1, kosov: 1 }
          - { drzava: MD, kos: 1, kosov: 1 }
          - { drzava: JP, kos: 1, kosov: 1 }
          - { drzava: HK, kos: 1, kosov: 1 }
          - { drzava: TH, kos: 1, kosov: 1 }
          - { drzava: GI, kos: 1, kosov: 1 }
          - { drzava: SM, kos: 1, kosov: 1 }
    # Ime "uvoz HU" pri enem košu, "uvoz HU 2/3" pri več (cakaj-na-uvoze.mjs
    # pri skupnem viru gleda vse posle, ki se začnejo z "uvoz <država>").
    name: uvoz ${{ matrix.drzava }}${{ matrix.kosov > 1 && format(' {0}/{1}', matrix.kos, matrix.kosov) || '' }}
    runs-on: ubuntu-latest
    # Koš sam ne začne nove lige po 190 minutah (ROK_MIN v nocni-uvoz.sh), da
    # ostane čas za shranjevanje predpomnilnika. Do 120 minut čakanja na
    # starejši ročni uvoz pride zraven, zato 240 ostane.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts
      # Vir hlf (hailafotbal.ro) bere stran v brskalniku brez glave (Playwright).
      - name: Chromium za vir hlf
        if: matrix.drzava == 'RO'
        run: npx playwright install chromium --only-shell --with-deps
      # Viri fmf (fmf.md), pfl-az (Azerbajdžan) in thaileague (Tajska) berejo zapisnike PDF s pdftotext (poppler-utils).
      - name: pdftotext za vire fmf, pfl-az in thaileague
        if: matrix.drzava == 'MD' || matrix.drzava == 'AZ' || matrix.drzava == 'TH'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      # Druzina uvozov (uvoz-zapisnikov, uvoz-lige, zdruzi-klube,
      # tedensko-cene) pise v iste tabele: klube, igralce, tekme, cene. Kar se
      # krizi (ista drzava, skupni posli), tece po vrsti — po casu zacetka,
      # brez izpodrivanja; razlicne drzave tecejo hkrati. Koši istega zagona
      # drug na drugega ne čakajo (isti zagon).
      - name: Pocakaj na starejse uvoze
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Le na uvoze iste države ter zdruzi-klube/tedensko-cene (glej skripto).
        run: node scripts/cakaj-na-uvoze.mjs --drzava ${{ matrix.drzava }}

      # Predpomnilnik prihrani ponovno pobiranje že prebranih zapisnikov in
      # nosi odtise uvoženih (nespremenjen zapisnik se ne uvaža znova) ter
      # stanje koša (katera liga je bila kdaj osvežena). Vsak koš ima svojega.
      # Shrani se VEDNO (tudi ob padcu ali preklicu): actions/cache ga je
      # shranil le ob uspehu, zato je posel, ki je padel na eni ligi, vsak
      # zagon znova uvažal vse.
      - name: Predpomnilnik zapisnikov
        uses: actions/cache/restore@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ matrix.drzava }}-k${{ matrix.kos }}od${{ matrix.kosov }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.drzava == 'DE' && 'zapisniki-DE-' || format('zapisniki-{0}-k{1}od{2}-', matrix.drzava, matrix.kos, matrix.kosov) }}
            zapisniki-${{ matrix.drzava }}-

      # === Vklopljene lige koša ===========================================
      # Napake posamezne lige zberemo, obdelamo tudi ostale in na koncu
      # vrnemo neuspeh, ce katera liga ni uspela (glej scripts/nocni-uvoz.sh).
      - name: Uvoz po ligah
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Ceske lige: is.fotbal.cz doseze le posrednik v EU (scripts/hetzner/facr-posrednik.sh).
          FACR_PROXY: ${{ secrets.FACR_PROXY }}
          DRZAVA: ${{ matrix.drzava }}
          KOS: ${{ matrix.kos }}
          KOSOV: ${{ matrix.kosov }}
          # Urni zagon ob vikendih dela le, kar je novo: preračuna samo kroge
          # z novimi zapisniki in ugiba pozicije samo, če je liga dobila nove
          # tekme. Jutranji, rezervni in ročni zagon naredijo vse, vključno z
          # varnostnim preračunom zadnjih 21 dni.
          URNIK: ${{ github.event.schedule }}
        run: bash scripts/nocni-uvoz.sh

      - name: Shrani predpomnilnik
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ matrix.drzava }}-k${{ matrix.kos }}od${{ matrix.kosov }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Uvoz zapisnikov ${{ matrix.drzava }} ${{ matrix.kos }}/${{ matrix.kosov }}"

  # === Skupno za vse lige ============================================
  # Ko so vse države končale (tudi neuspešno).
  skupno:
    needs: [zacni, uvoz]
    if: always() && needs.zacni.outputs.teci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Združi duplikate: ključ je `competition_id|full_name`, tako nikoli ne
      # pomeša vrstic iz dveh lig — mladinec X in član X ostaneta ločena,
      # četudi je oseba ista. Poganja se enkrat.
      - name: Združi duplikate (vse lige)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Ceske lige: is.fotbal.cz doseze le posrednik v EU (scripts/hetzner/facr-posrednik.sh).
          FACR_PROXY: ${{ secrets.FACR_PROXY }}
        run: node scripts/zdruzi-duplikate.mjs --pisi
        continue-on-error: true
      # Uradne odsotnosti potrjenih igralcev: kdor je po zapisniku igral med
      # odprto odsotnostjo, dobi "ni držalo" in opomin (brez vpliva na točke).
      # Po združitvi duplikatov, da nastopi visijo na pravih vrsticah.
      - name: Preveri uradne odsotnosti
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preveri-uradne-odsotnosti.mjs
        continue-on-error: true
