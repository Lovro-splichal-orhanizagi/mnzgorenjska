name: Uvoz zapisnikov

# Zapisniki se objavijo nekaj ur do nekaj dni po tekmi. Ker se tekme igrajo
# predvsem ob petkih, sobotah in nedeljah, na te dneve pobiramo VSAKO URO
# (tekme končane 17-19h → zapisnik tipično 20-22h, včasih zjutraj). Med
# tednom enkrat dnevno je dovolj.
#
# Uvoz je idempotenten: tekma z istim zapisnikom se posodobi, ne podvoji.
#
# **Seznam lig pove baza, ne ta datoteka.** Doslej sta bili člani in mladinci
# napisani kot dva bloka korakov. Ob tretji ligi bi to pomenilo, da se nova
# liga tiho ne uvaža — stran bi jo pokazala, točke pa se ne bi nikoli
# osvežile in nič ne bi javilo napake. Zato korak najprej vpraša
# `aktivna-tekmovanja.mjs`, katera tekmovanja so vklopljena.
#
# Vsaka liga ima svoje kroge, tekme, igralce in fantasy ekipe; ista oseba je
# pri članih in mladincih dve vrstici (`players.competition_id`), zato
# statistika med ligami ne uhaja. Klubi so si skupni, vir pa ne — naslove in
# vzdevke klubov da `competitions.source` prek `scripts/viri/`.
on:
  schedule:
    # Petek (5), Sobota (6), Nedelja (0) — vsako uro
    - cron: '0 * * * 5,6,0'
    # Ponedeljek do četrtek — enkrat, ob 5:00 UTC (7:00 po naše)
    - cron: '0 5 * * 1-4'
  workflow_dispatch:

permissions:
  contents: read

# Vsak delovni tok iz druzine uvozov ima svojo skupino. Skupna `uvoz` je
# pomenila, da je vsak nov cron izpodrinil rocni zagon, ki je cakal v vrsti
# (GitHub v skupini hrani le EN cakajoci zagon, starejsega preklice). Tu je
# izpodrivanje v redu — naslednji cron naredi isto delo.
#
# Kateri pari ne smejo teci hkrati (vsi pisejo v iste tabele):
#   - uvoz-zapisnikov / uvoz-lige: klubi, igralci, krogi, tekme, nastopi —
#     dva uvoza iste lige bi ustvarila dvojnike igralcev in klubov;
#   - zdruzi-klube z vsemi uvozi: uvoz si ob zagonu zapomni id-je klubov in
#     ce mu enega medtem izbrisemo, tekme obvisijo;
#   - tedensko-cene / uvoz-lige (cene): oba pisesta cene istih igralcev.
# Grbi (grbi-nzs) pisejo le `teams.logo_url` in tecejo loceno.
# Zaporedje zagotovi korak "Pocakaj na starejse uvoze": vsak zagon pocaka
# na tiste iz druzine, ki so se zaceli pred njim.
concurrency:
  group: uvoz-zapisnikov
  cancel-in-progress: false

jobs:
  uvoz:
    runs-on: ubuntu-latest
    # 17 lig je 13. septembra porabilo 43 minut ze pred zadnjo ligo.
    # Ura pusti prostor se za njen uvoz, predpomnilnik in obcasno pocasne vire.
    # 24 lig; z `--sveze` vsaka vzame minuto, brez njega tri.
    # Do 120 minut cakanja na starejsi (rocni) uvoz pride zraven.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Nobena odvisnost ne potrebuje namestitvenih skript (edina je fsevents
      # za macOS); brez njih tuja koda ob namestitvi ne tece.
      - run: npm ci --ignore-scripts

      # Druzina uvozov (uvoz-zapisnikov, uvoz-lige, zdruzi-klube,
      # tedensko-cene) pise v iste tabele: klube, igralce, tekme, cene. Zato
      # tecejo po vrsti — po casu zacetka, brez izpodrivanja.
      - name: Pocakaj na starejse uvoze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MOJ=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt --jq .startedAt)
          for i in $(seq 1 120); do
            n=0
            for wf in uvoz-zapisnikov.yml uvoz-lige.yml zdruzi-klube.yml tedensko-cene.yml; do
              # Brez --status: tudi cakajoci (queued) starejsi zagon mora priti
              # prvi. Zato vec kot 20 — koncani zagoni zasedejo del seznama.
              k=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 50 \
                --json databaseId,startedAt,status \
                --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID and .startedAt > \"2000\" and (.startedAt < \"$MOJ\" or (.startedAt == \"$MOJ\" and .databaseId < $GITHUB_RUN_ID)))] | length")
              n=$((n + k))
            done
            [ "$n" -eq 0 ] && exit 0
            echo "Pred mano tece se $n uvozov — cakam ($i/120 min)"
            sleep 60
          done
          echo "::error::Starejsi uvoz tece ze dve uri."
          exit 1

      # Predpomnilnik prihrani ponovno pobiranje že prebranih zapisnikov —
      # tako ob vsakem zagonu s strani MNZ potegnemo le nove tekme.
      - name: Predpomnilnik zapisnikov
        uses: actions/cache@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ github.run_id }}
          restore-keys: zapisniki-

      # === Vse vklopljene lige ===========================================
      # Napake posamezne lige zberemo, obdelamo tudi ostale in na koncu
      # vrnemo neuspeh, ce katera liga ni uspela.
      - name: Uvoz po ligah
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/aktivna-tekmovanja.mjs > /tmp/lige.txt
          echo "Lige za uvoz: $(tr '\n' ' ' < /tmp/lige.txt)"
          # Ena liga ne sme podreti ostalih. Spletisca zvez so razlicno
          # zanesljiva: Nova Gorica je zvecer strezla okrnjeno stran, Ljubljana
          # in NZS sta obcasno pocasni. Pod `set -e` je prva taka napaka
          # ustavila zanko in vse NASLEDNJE lige tisti dan sploh niso bile
          # uvozene — pri sestnajstih ligah je to tiha izguba dneva.
          #
          # Vsak ukaz preverimo posebej (`|| ok=0`). Prej so bili povezani z
          # &&, kar je pomenilo, da je napaka razporeda (npr. varovalo pred
          # okrnjenim razporedom) ustavila tudi uvoz zapisnikov te lige.
          # Zagon se na koncu vseeno konca z napako, da se opozorilo vidi.
          padle=""
          while IFS= read -r liga; do
            [ -n "$liga" ] || continue
            echo "::group::$liga"
            ok=1
            node scripts/uvoz-razporeda.mjs   --tekmovanje "$liga" --pisi </dev/null || ok=0
            node scripts/uvoz-delegiranja.mjs --tekmovanje "$liga" --pisi </dev/null || ok=0
            node scripts/uvoz-zapisnikov.mjs  --tekmovanje "$liga" --sveze 21 </dev/null || ok=0
            # Prestopi so porocilo; vir, ki jih ne objavlja, se konca z 0.
            node scripts/uvoz-registracij.mjs --tekmovanje "$liga" </dev/null || ok=0
            node scripts/ugani-pozicije.mjs   --tekmovanje "$liga" --pisi --samo-nove </dev/null || ok=0
            if [ "$ok" = 1 ]; then
              echo "$liga: v redu"
            else
              echo "::warning title=Uvoz lige::$liga ni uspela; ostale se nadaljujejo"
              padle="$padle $liga"
            fi
            echo "::endgroup::"
          done < /tmp/lige.txt
          if [ -n "$padle" ]; then
            echo "::error title=Neuspele lige::$padle"
            exit 1
          fi

      # === Skupno za vse lige ============================================
      # Združi duplikate: ključ je `competition_id|full_name`, tako nikoli ne
      # pomeša vrstic iz dveh lig — mladinec X in član X ostaneta ločena,
      # četudi je oseba ista. Poganja se enkrat.
      - name: Združi duplikate (vse lige)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/zdruzi-duplikate.mjs --pisi
        continue-on-error: true

      # Rdec zagon v GitHubu ni alarm, dokler ga kdo ne vidi. Uvoz je dvakrat
      # padel in dva dni ni opazil nihce.
      - name: Javi padec na Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TEDENSKO }}
        run: node scripts/javi-napako.mjs "Uvoz zapisnikov"
