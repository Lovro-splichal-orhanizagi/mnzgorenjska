          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in *@127.0.0.1*) echo "tunel=da" >> "$GITHUB_OUTPUT";; *) exit 1;; esac
