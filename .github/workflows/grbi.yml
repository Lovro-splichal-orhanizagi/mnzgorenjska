name: Grbi klubov (rocni seznam)

# `scripts/prenesi-grbe.mjs` ima rocno sestavljen seznam naslovov grbov za
# klube, ki jih NZS ne objavlja (regionalne lige). Doslej je tekel le lokalno,
# zato so grbi, dodani v seznam, ostali v lokalni bazi in jih produkcija ni
# nikoli videla. Zivi servisni kljuc je samo tu.
#
# Privzeto samo nacrt; `pisi` prenese grbe v public/grbi, zapise logo_url in
# nove datoteke potisne v git. Klubov, ki grb ze imajo, ne prepise.
#
# `vir = hns`: hrvaski klubi z glave strani tekme na HNS Semaforju
# (scripts/grbi-hns.mjs). `tekmovanje` omeji na eno ligo (npr. hr-mz-1mnl),
# `prepisi` zamenja tudi obstojece grbe teh klubov.
#
# `vir = oefb`: avstrijski klubi z oefb.at (scripts/grbi-oefb.mjs), id grba iz
# razporeda lige. /oefb2/images/ robots.txt prepoveduje — beremo ga le z
# izrecnim dovoljenjem OFB (9. 10. 2026). Brez `tekmovanje` vse aktivne at- lige.
#
# `vir = jalgpall`: estonski klubi z glave zapisnika na jalgpall.ee
# (scripts/grbi-jalgpall.mjs). Brez `tekmovanje` vse ee- lige.

on:
  workflow_dispatch:
    inputs:
      vir:
        description: 'rocni = seznam v prenesi-grbe.mjs, sportnet = slovaski klubi s futbalnet.sk, hns = hrvaski klubi s semafor.hns.family, oefb = avstrijski klubi z oefb.at, jalgpall = estonski klubi z jalgpall.ee'
        required: false
        default: rocni
        type: choice
        options: [rocni, sportnet, hns, oefb, jalgpall]
      tekmovanje:
        description: 'Samo za hns/oefb/jalgpall: ena liga (slug, npr. hr-mz-1mnl, at-k-kaerntner-liga); prazno = vse hrvaske / vse aktivne avstrijske lige'
        required: false
        default: ''
        type: string
      prepisi:
        description: 'Samo za hns/oefb/jalgpall: prepisi tudi obstojece grbe'
        required: false
        default: false
        type: boolean
      pisi:
        description: 'Prenesi in zapisi (sicer samo nacrt)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: grbi
  cancel-in-progress: false

jobs:
  grbi:
    runs-on: ubuntu-latest
    # hns brez `tekmovanje` bere ~500 strani tekem in ~1000 slik po 500 ms.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Za pomanjšanje grbov (sips je le na macOS); ubuntu-latest ga nima več.
      - run: command -v convert || command -v magick || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - name: Prenesi grbe in zapisi logo_url
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Vnosi gredo skozi okolje, ne naravnost v ukaz.
          VIR: ${{ inputs.vir }}
          PISI: ${{ inputs.pisi }}
          TEKMOVANJE: ${{ inputs.tekmovanje }}
          PREPISI: ${{ inputs.prepisi }}
        run: |
          set -euo pipefail
          case "$VIR" in
            sportnet) skripta=grbi-sportnet ;;
            hns) skripta=grbi-hns ;;
            oefb) skripta=grbi-oefb ;;
            jalgpall) skripta=grbi-jalgpall ;;
            *) skripta=prenesi-grbe ;;
          esac
          args=()
          if [ "$PISI" = "true" ]; then args+=(--pisi); fi
          if [ "$VIR" = "hns" ] || [ "$VIR" = "oefb" ] || [ "$VIR" = "jalgpall" ]; then
            if [ -n "$TEKMOVANJE" ]; then args+=(--tekmovanje "$TEKMOVANJE"); fi
            if [ "$PREPISI" = "true" ]; then args+=(--prepisi); fi
          fi
          node "scripts/$skripta.mjs" "${args[@]}"
      - name: Zapisi nove grbe v git
        if: inputs.pisi
        run: |
          set -euo pipefail
          git add public/grbi
          if git diff --cached --quiet; then echo "Ni novih grbov."; exit 0; fi
          git config user.name "slff-bot"
          git config user.email "slff-bot@users.noreply.github.com"
          git commit -m "Grbi klubov ($(git diff --cached --numstat | wc -l | tr -d ' ') datotek)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            [ "$i" -lt 5 ] || { echo "push ni uspel po 5 poskusih"; exit 1; }
            sleep $((i * 10))
          done
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
