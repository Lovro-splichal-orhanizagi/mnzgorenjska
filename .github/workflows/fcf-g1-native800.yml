          printf '%s\n' "$ZNANI" > ~/.ssh/known_hosts
          ssh -fN -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -L 5432:127.0.0.1:5432 deploy@2.31.6.53
      - name: Execute native800 price
        id: operation
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FCF_G1_NATIVE800_PREVIOUS_SHA: ${{ needs.native800-import.outputs.manifest_sha }}
        run: node scripts/fcf-g1-native800-operator.mjs price
      - name: Retain native800 price
        uses: actions/upload-artifact@v4
        with:
          name: g1-native800-price-${{ github.run_id }}-1
          path: g1-native800-price/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain native800 price partial outcome
